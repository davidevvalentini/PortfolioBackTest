/* ============================= CALCULATION ============================= */
function resolveTimeframeDates(tf){
  const today = new Date();
  const fmt = d => d.toISOString().slice(0,10);
  let start, end = fmt(today);
  switch(tf.preset){
    case "1Y": { const d = new Date(today); d.setFullYear(d.getFullYear()-1); start = fmt(d); break; }
    case "3Y": { const d = new Date(today); d.setFullYear(d.getFullYear()-3); start = fmt(d); break; }
    case "5Y": { const d = new Date(today); d.setFullYear(d.getFullYear()-5); start = fmt(d); break; }
    case "10Y": { const d = new Date(today); d.setFullYear(d.getFullYear()-10); start = fmt(d); break; }
    case "YTD": { start = `${today.getFullYear()}-01-01`; break; }
    case "MAX": { start = "1990-01-01"; break; }
    case "custom": { start = tf.start || "2015-01-01"; end = tf.end || end; break; }
    default: { const d = new Date(today); d.setFullYear(d.getFullYear()-5); start = fmt(d); }
  }
  return { start, end };
}

async function refreshAutoRiskFreeRate(p){
  if(p.riskFreeAuto === false || p.currencySymbol !== "€") return null;
  try{
    const res = await fetch("/api/risk-free?currency=EUR");
    const data = await res.json();
    if(!res.ok || data.error) throw new Error(data.error || "Impossibile aggiornare il tasso BCE.");
    p.riskFree = data.rate;
    p.riskFreeAuto = true;
    p.riskFreeAsOf = data.asOf;
    saveState();
    const input = document.getElementById("riskFreeInput");
    if(input) input.value = data.rate;
    return data;
  }catch(err){
    // Keep the last saved value: a temporary ECB outage must not block a backtest.
    console.warn("Automatic risk-free rate update failed:", err);
    return null;
  }
}

async function runCalculation(p){
  const statusLine = document.getElementById("statusLine");
  const btn = document.getElementById("btnCalc");
  const holdings = p.holdings.filter(h => h.ticker && h.ticker.trim());

  if(!holdings.length){
    statusLine.textContent = t("needAtLeastOne");
    statusLine.className = "status-line error";
    return;
  }

  const weightSum = holdings.reduce((s,h) => s + (parseFloat(h.weight)||0), 0) || 1;
  const { start, end } = resolveTimeframeDates(p.timeframe);

  btn.disabled = true;
  btn.classList.add("loading");
  statusLine.className = "status-line";
  statusLine.textContent = t("downloadingData", {n: holdings.length});

  try{
    const riskFreeInfo = await refreshAutoRiskFreeRate(p);
    const results = await Promise.all(holdings.map(h =>
      fetch(`/api/history?ticker=${encodeURIComponent(h.ticker)}&start=${start}&end=${end}`).then(r => r.json())
    ));

    const errors = results.filter(r => r.error);
    if(errors.length){
      statusLine.className = "status-line error";
      statusLine.textContent = t("errorPrefix", {msg: errors.map(e => e.error).join(" | ")});
      showToast(t("toastErrorTitle"), errors.map(e => e.error).join(" | "), "error");
      btn.disabled = false;
      return;
    }

    const seriesByTicker = {};
    holdings.forEach((h, i) => {
      const pts = results[i].points;
      const map = new Map(pts.map(pt => [pt.date, pt.close]));
      seriesByTicker[h.ticker] = { dates: pts.map(pt=>pt.date), map };
    });

    const firstDates = holdings.map(h => seriesByTicker[h.ticker].dates[0]).filter(Boolean);
    const lastDates = holdings.map(h => seriesByTicker[h.ticker].dates.slice(-1)[0]).filter(Boolean);
    const effectiveStart = firstDates.sort().slice(-1)[0];
    const lateDays = (new Date(effectiveStart) - new Date(start)) / 864e5;
    const limitingInstruments = lateDays > 10
      ? holdings.filter(h => seriesByTicker[h.ticker].dates[0] === effectiveStart).map(h => h.ticker)
      : [];
    const effectiveEnd = lastDates.sort()[0];

    const allDatesSet = new Set();
    holdings.forEach(h => seriesByTicker[h.ticker].dates.forEach(d => {
      if(d >= effectiveStart && d <= effectiveEnd) allDatesSet.add(d);
    }));
    const unionDates = Array.from(allDatesSet).sort();

    if(unionDates.length < 5){
      statusLine.className = "status-line error";
      statusLine.textContent = t("notEnoughData");
      showToast(t("toastErrorTitle"), t("notEnoughData"), "error");
      btn.disabled = false;
      return;
    }

    const priceGrid = {};
    holdings.forEach(h => {
      const { map } = seriesByTicker[h.ticker];
      let last = null;
      const arr = new Array(unionDates.length);
      unionDates.forEach((d, i) => {
        if(map.has(d)) last = map.get(d);
        arr[i] = last;
      });
      priceGrid[h.ticker] = arr;
    });

    // --- currency conversion: convert any holding quoted in a currency other
    // than the portfolio's base currency into that base currency, using daily
    // ECB reference rates, BEFORE any weighting/rebalancing math happens.
    const baseCurrency = CURRENCY_MAP[p.currencySymbol] || "EUR";
    const holdingCurrency = {};
    holdings.forEach((h,i) => { holdingCurrency[h.ticker] = (results[i].currency || "").toUpperCase(); });
    const foreignCurrencies = Array.from(new Set(
      holdings.map(h => holdingCurrency[h.ticker]).filter(c => c && c !== baseCurrency)
    ));
    const fxConversions = [];

    if(foreignCurrencies.length){
      statusLine.textContent = t("convertingFx", {currencies: foreignCurrencies.join(", ")});
      try{
        const fxRes = await fetch(`/api/fx?base=${baseCurrency}&symbols=${foreignCurrencies.join(",")}&start=${unionDates[0]}&end=${unionDates[unionDates.length-1]}`);
        const contentType = fxRes.headers.get("content-type") || "";
        if(!fxRes.ok || !contentType.includes("json")){
          throw new Error(t("fxEndpointMissing"));
        }
        const fxData = await fxRes.json();
        if(fxData.error) throw new Error(fxData.error);

        // build a forward/backward-filled rate lookup per currency, aligned to unionDates
        const fxByCurrency = {};
        foreignCurrencies.forEach(cur => {
          let last = null;
          const arr = new Array(unionDates.length).fill(null);
          unionDates.forEach((d,i) => {
            const dayRates = fxData.rates[d];
            if(dayRates && dayRates[cur] !== undefined) last = dayRates[cur];
            arr[i] = last;
          });
          // back-fill any leading nulls (e.g. FX market closed on the very first date) with the first known rate
          const firstKnown = arr.find(v => v !== null);
          for(let i=0;i<arr.length && arr[i]===null;i++) arr[i] = firstKnown;
          fxByCurrency[cur] = arr;
        });

        holdings.forEach(h => {
          const cur = holdingCurrency[h.ticker];
          if(!cur || cur === baseCurrency) return;
          const rates = fxByCurrency[cur];
          if(!rates) return;
          priceGrid[h.ticker] = priceGrid[h.ticker].map((price, i) =>
            (price === null || rates[i] === null || rates[i] === undefined) ? price : price / rates[i]
          );
          fxConversions.push({ ticker: h.ticker, from: cur, to: baseCurrency });
        });
      }catch(fxErr){
        console.error(fxErr);
        statusLine.className = "status-line error";
        statusLine.textContent = t("fxError", {msg: fxErr.message});
        showToast(t("toastErrorTitle"), fxErr.message, "error");
        btn.disabled = false;
        return;
      }
    }

    // optional resampling to month-end prices (matches PortfolioVisualizer's default monthly granularity)
    let calcDates = unionDates, calcPriceGrid = priceGrid;
    const isMonthly = p.granularity === "M";
    if(isMonthly){
      const groupLastIdx = {};
      unionDates.forEach((d,i) => { groupLastIdx[d.slice(0,7)] = i; });
      let monthKeys = Object.keys(groupLastIdx).sort();

      // Drop the current, still-in-progress calendar month from the monthly
      // series: if the last available trading day falls in the SAME month as
      // today but isn't literally the last day of that month, that month's
      // data is partial (e.g. requesting through 31/12 but only data through
      // 28/12 exists because the month isn't over yet) — treating it as a
      // full month would understate/overstate that period's return and skew
      // CAGR/vol versus tools that only count fully-elapsed months.
      const lastMonthKey = monthKeys[monthKeys.length-1];
      const todayObj = new Date();
      const todayMonthKey = todayObj.toISOString().slice(0,7);
      if(lastMonthKey === todayMonthKey){
        const lastDayOfMonth = new Date(todayObj.getFullYear(), todayObj.getMonth()+1, 0).getDate();
        if(todayObj.getDate() < lastDayOfMonth && monthKeys.length > 1){
          monthKeys = monthKeys.slice(0, -1);
        }
      }

      calcDates = monthKeys.map(k => unionDates[groupLastIdx[k]]);
      calcPriceGrid = {};
      holdings.forEach(h => {
        calcPriceGrid[h.ticker] = monthKeys.map(k => priceGrid[h.ticker][groupLastIdx[k]]);
      });
    }
    const periodsPerYear = isMonthly ? 12 : 252;

    const weights = {};
    holdings.forEach(h => { weights[h.ticker] = (parseFloat(h.weight)||0) / weightSum; });

    const rebalanceMode = p.rebalance;
    const N = calcDates.length;
    const portfolioValue = new Array(N);
    const shares = {};
    holdings.forEach(h => { shares[h.ticker] = (weights[h.ticker] * 100) / calcPriceGrid[h.ticker][0]; });
    portfolioValue[0] = 100;

    function periodKey(dateStr, mode){
      const [y,m] = dateStr.split("-");
      if(mode === "Y") return y;
      if(mode === "Q") return y + "-Q" + Math.ceil(parseInt(m)/3);
      if(mode === "M") return y + "-" + m;
      return null;
    }

    // Advisory fee: charged every period by reducing the units held, so it compounds.
    // (Fund TERs are already embedded in ETF prices and must not be deducted again.)
    const feeAnnual = Math.max(0, parseFloat(p.advisoryFee) || 0) / 100;
    const MS_YEAR = 365.25 * 864e5;   // fee accrues on calendar time, so it is exact whatever the trading calendar
    const band = Math.max(0.5, parseFloat(p.rebalanceBand) || 5) / 100;
    let rebalanceCount = 0;
    for(let t=1; t<N; t++){
      let val = 0;
      holdings.forEach(h => { val += shares[h.ticker] * calcPriceGrid[h.ticker][t]; });
      if(feeAnnual > 0){
        const keep = Math.pow(1 - feeAnnual, (new Date(calcDates[t]) - new Date(calcDates[t-1])) / MS_YEAR);
        holdings.forEach(h => { shares[h.ticker] *= keep; });
        val *= keep;
      }
      portfolioValue[t] = val;
      let doRebalance = false;
      if(rebalanceMode === "T"){
        if(val > 0) doRebalance = holdings.some(h =>
          Math.abs(shares[h.ticker] * calcPriceGrid[h.ticker][t] / val - weights[h.ticker]) > band);
      } else if(rebalanceMode && rebalanceMode !== "none"){
        doRebalance = periodKey(calcDates[t-1], rebalanceMode) !== periodKey(calcDates[t], rebalanceMode);
      }
      if(doRebalance && t < N-1){
        holdings.forEach(h => { shares[h.ticker] = (weights[h.ticker] * val) / calcPriceGrid[h.ticker][t]; });
        rebalanceCount++;
      }
    }

    const dailyReturns = [];
    for(let t=1; t<N; t++) dailyReturns.push(portfolioValue[t]/portfolioValue[t-1] - 1);

    const totalReturn = portfolioValue[N-1]/portfolioValue[0] - 1;
    const yearsSpan = (new Date(calcDates[N-1]) - new Date(calcDates[0])) / (1000*3600*24*365.25);
    const cagr = yearsSpan > 0 ? Math.pow(portfolioValue[N-1]/portfolioValue[0], 1/yearsSpan) - 1 : null;
    const meanDaily = mean(dailyReturns);
    const stdDaily = stdev(dailyReturns);
    const annVol = stdDaily * Math.sqrt(periodsPerYear);
    const annReturn = meanDaily * periodsPerYear;
    const rf = (parseFloat(p.riskFree)||0) / 100;
    const sharpe = annVol > 0 ? (annReturn - rf) / annVol : null;

    const rfDaily = rf / periodsPerYear;
    const downsideSqSum = dailyReturns.reduce((s,r) => s + Math.pow(Math.min(0, r - rfDaily), 2), 0);
    const downsideDev = Math.sqrt(downsideSqSum / dailyReturns.length) * Math.sqrt(periodsPerYear);
    const sortino = downsideDev > 0 ? (annReturn - rf) / downsideDev : null;

    // Euro-area inflation (HICP) for real returns and indexed withdrawals — best effort, EUR only.
    let cpiAt = null, realValue = null, realCagr = null, inflationAvg = null, inflationThrough = null;
    if(baseCurrency === "EUR"){
      try{
        const ir = await fetch("/api/inflation");
        const ct = ir.headers.get("content-type") || "";
        const idata = ir.ok && ct.includes("json") ? await ir.json() : null;
        const ipts = idata && idata.points ? idata.points : [];
        if(ipts.length){
          const months = ipts.map(x => x.month), vals = ipts.map(x => x.index);
          cpiAt = (dateStr) => {
            const m = dateStr.slice(0,7);
            let lo = 0, hi = months.length - 1, ans = -1;
            while(lo <= hi){ const mid = (lo+hi) >> 1; if(months[mid] <= m){ ans = mid; lo = mid+1; } else hi = mid-1; }
            return ans >= 0 ? vals[ans] : vals[0];
          };
          const c0 = cpiAt(calcDates[0]);
          realValue = portfolioValue.map((v, i) => v * c0 / cpiAt(calcDates[i]));
          if(yearsSpan > 0){
            realCagr = Math.pow(realValue[N-1] / realValue[0], 1/yearsSpan) - 1;
            inflationAvg = Math.pow(cpiAt(calcDates[N-1]) / c0, 1/yearsSpan) - 1;
          }
          inflationThrough = months[months.length-1];
        }
      }catch(err){ console.warn("Inflation data unavailable:", err); }
    }

    const startBalance = parseFloat(p.initialBalance) || 10000;
    const endBalance = startBalance * (1 + totalReturn);
    const pacResult = (p.pac && p.pac.enabled)
      ? computePacSimulation(calcDates, portfolioValue, startBalance, p.pac)
      : null;
    const withdrawalResult = (p.withdrawal && p.withdrawal.enabled)
      ? computeWithdrawalSimulation(calcDates, portfolioValue, startBalance, p.withdrawal, cpiAt)
      : null;

    let peak = portfolioValue[0], maxDD = 0;
    const drawdownSeries = [0];
    for(let t=1; t<N; t++){
      peak = Math.max(peak, portfolioValue[t]);
      const dd = portfolioValue[t]/peak - 1;
      drawdownSeries.push(dd);
      if(dd < maxDD) maxDD = dd;
    }

    const yearBoundaries = {};
    calcDates.forEach((d,i) => {
      const y = d.slice(0,4);
      if(!(y in yearBoundaries)) yearBoundaries[y] = { first:i, last:i };
      yearBoundaries[y].last = i;
    });
    const yearKeys = Object.keys(yearBoundaries).sort();
    const yearReturns = yearKeys.map((y, yi) => {
      const b = yearBoundaries[y];
      // Calendar-year style: previous year-end → this year-end when available
      const startIdx = yi > 0 ? yearBoundaries[yearKeys[yi-1]].last : b.first;
      const partial = yi === 0 && calcDates[b.first].slice(5) > "01-15";
      return { year: y, ret: portfolioValue[b.last]/portfolioValue[startIdx] - 1, partial };
    });
    const bestYear = yearReturns.reduce((a,b)=> b.ret>a.ret?b:a, yearReturns[0]);
    const worstYear = yearReturns.reduce((a,b)=> b.ret<a.ret?b:a, yearReturns[0]);

    const instrumentYearReturns = holdings.map(h => {
      const px = calcPriceGrid[h.ticker];
      return {
        ticker: h.ticker, name: h.name || h.ticker,
        years: yearKeys.map((y, yi) => {
          const b = yearBoundaries[y];
          const startIdx = yi > 0 ? yearBoundaries[yearKeys[yi-1]].last : b.first;
          const partial = yi === 0 && calcDates[b.first].slice(5) > "01-15";
          return { year: y, ret: px[b.last]/px[startIdx] - 1, partial };
        })
      };
    });

    const retGrids = {};
    holdings.forEach(h => {
      const px = calcPriceGrid[h.ticker];
      const r = [];
      for(let t=1;t<N;t++) r.push(px[t]/px[t-1] - 1);
      retGrids[h.ticker] = r;
    });
    const corr = {};
    holdings.forEach(h1 => {
      corr[h1.ticker] = {};
      holdings.forEach(h2 => {
        corr[h1.ticker][h2.ticker] = correlation(retGrids[h1.ticker], retGrids[h2.ticker]);
      });
    });

    const instrumentStats = holdings.map(h => {
      const r = retGrids[h.ticker];
      const px = calcPriceGrid[h.ticker];
      const instrTotalReturn = px[px.length-1]/px[0] - 1;
      const instrCagr = yearsSpan > 0 ? Math.pow(px[px.length-1]/px[0], 1/yearsSpan) - 1 : null;
      return {
        ticker: h.ticker, name: h.name || h.ticker,
        weight: (parseFloat(h.weight)||0) / weightSum,
        annReturn: mean(r) * periodsPerYear, annVol: stdev(r) * Math.sqrt(periodsPerYear),
        cagr: instrCagr, totalReturn: instrTotalReturn
      };
    });

    const drawdownEpisodes = computeDrawdownEpisodes(calcDates, portfolioValue);
    const efficientFrontier = computeEfficientFrontier(instrumentStats, corr, rf);
    const rollingReturns = computeRollingReturns(calcDates, portfolioValue, periodsPerYear);

    // monthly returns export data — always computed on month-end resampling,
    // independent of the "Granularità" setting used for the main calculation,
    // so it can be compared 1:1 against tools like PortfolioVisualizer.
    const monthlyExport = (() => {
      let mDates, mPriceGrid, mPortfolioValue;
      if(isMonthly){
        mDates = calcDates; mPriceGrid = calcPriceGrid; mPortfolioValue = portfolioValue;
      } else {
        const groupLastIdx = {};
        unionDates.forEach((d,i) => { groupLastIdx[d.slice(0,7)] = i; });
        const monthKeys = Object.keys(groupLastIdx).sort();
        mDates = monthKeys.map(k => unionDates[groupLastIdx[k]]);
        mPriceGrid = {};
        holdings.forEach(h => { mPriceGrid[h.ticker] = monthKeys.map(k => priceGrid[h.ticker][groupLastIdx[k]]); });
        mPortfolioValue = monthKeys.map(k => portfolioValue[groupLastIdx[k]]);
      }
      const M = mDates.length;
      const instrumentReturns = {};
      holdings.forEach(h => {
        const px = mPriceGrid[h.ticker];
        const r = [];
        for(let i=1;i<M;i++) r.push(px[i]/px[i-1] - 1);
        instrumentReturns[h.ticker] = r;
      });
      const portfolioReturns = [];
      for(let i=1;i<M;i++) portfolioReturns.push(mPortfolioValue[i]/mPortfolioValue[i-1] - 1);
      return { dates: mDates.slice(1), tickers: holdings.map(h=>h.ticker), instrumentReturns, portfolioReturns };
    })();

    let benchmark = null;
    if(p.benchmarkType === "ticker" && p.benchmarkTicker){
      statusLine.textContent = t("benchmark") + "...";
      const virtualBp = { name: p.benchmarkTicker, rebalance: "none", holdings: [{ ticker: p.benchmarkTicker, weight: 100 }] };
      try{ benchmark = await computeBenchmarkSeries(virtualBp, calcDates, baseCurrency, periodsPerYear); }
      catch(e){ console.error(e); benchmark = null; }
    } else if(p.benchmarkId){
      const bp = state.portfolios.find(x => x.id === p.benchmarkId);
      if(bp){
        statusLine.textContent = t("benchmark") + "...";
        try{ benchmark = await computeBenchmarkSeries(bp, calcDates, baseCurrency, periodsPerYear); }
        catch(e){ console.error(e); benchmark = null; }
      }
    }

    if(benchmark){
      const benchRets = [];
      for(let t=1;t<benchmark.values.length;t++) benchRets.push(benchmark.values[t]/benchmark.values[t-1] - 1);
      const cov = covariance(dailyReturns, benchRets);
      const benchVar = covariance(benchRets, benchRets);
      benchmark.beta = benchVar > 0 ? cov / benchVar : null;
      const benchAnnReturn = mean(benchRets) * periodsPerYear;
      benchmark.alpha = (benchmark.beta !== null)
        ? (annReturn - rf) - benchmark.beta * (benchAnnReturn - rf)
        : null;
      const excess = dailyReturns.map((r,i) => r - (benchRets[i]||0));
      const te = stdev(excess) * Math.sqrt(periodsPerYear);
      benchmark.trackingError = te;
      benchmark.informationRatio = te > 0 ? (annReturn - benchAnnReturn) / te : null;
    }

    const result = {
      dates: calcDates, portfolioValue, drawdownSeries,
      totalReturn, cagr, annVol, sharpe, sortino, maxDD, bestYear, worstYear, yearReturns, instrumentYearReturns,
      startBalance, endBalance, currencySymbol: p.currencySymbol || "€",
      effectiveStart, effectiveEnd, requestedStart: start, requestedEnd: end,
      corr, tickers: holdings.map(h=>h.ticker), instrumentStats, drawdownEpisodes,
      granularity: p.granularity || "D", monthlyExport, fxConversions, baseCurrency,
      benchmark, rollingReturns, periodsPerYear, pac: pacResult, withdrawal: withdrawalResult,
      efficientFrontier, periodMean: meanDaily, periodStd: stdDaily, annReturn,
      advisoryFee: feeAnnual, rebalanceCount, rebalanceMode,
      realValue, realCagr, inflationAvg, inflationThrough, limiting: limitingInstruments
    };

    p.lastResult = result;
    saveState();

    // Collapse the editing sections now that a result is available, to make room for the results.
    setCollapsibleState("compositionToggle", "compositionBody", false);
    setCollapsibleState("reportContentToggle", "reportFormBody", false);

    let note = "";
    if(limitingInstruments.length){
      note = t("effectiveStartNote", {date: effectiveStart}) + t("limitedNote", {list: limitingInstruments.join(", ")});
    }
    if(feeAnnual > 0) note += t("feeNetNote", {fee: (feeAnnual*100).toFixed(2).replace(".", ",")});
    if(rebalanceMode && rebalanceMode !== "none") note += t("rebalanceCountNote", {n: rebalanceCount});
    if(isMonthly){
      const partialMonths = calcDates.filter(d => {
        const y = Number(d.slice(0,4)), m = Number(d.slice(5,7));
        const last = new Date(Date.UTC(y, m, 0)).getUTCDate();
        return Number(d.slice(8,10)) < last;
      });
      if(partialMonths.length){
        note += t("monthEndNote", {list: partialMonths.slice(-6).join(", ") + (partialMonths.length>6?"…":"")});
      }
    }
    if(fxConversions.length){
      const list = fxConversions.map(c => `${c.ticker} (${c.from}→${c.to})`).join(", ");
      note += " " + t("fxNote", {base: baseCurrency, list});
    }
    if(riskFreeInfo){
      note += " " + t("riskFreeAutoUsed", {rate: riskFreeInfo.rate.toFixed(2), date: riskFreeInfo.asOf});
    }
    statusLine.className = "status-line";
    statusLine.textContent = t("calcComplete", {n:N, start:effectiveStart, end:effectiveEnd}) + note;

    showResults(p, result);
    showToast(t("toastDoneTitle"), t("toastDoneMsg", {n:N}));
  }catch(e){
    console.error(e);
    statusLine.className = "status-line error";
    statusLine.textContent = t("calcError", {msg: e.message});
    showToast(t("toastErrorTitle"), e.message, "error");
  }finally{
    btn.disabled = false;
    btn.classList.remove("loading");
  }
}

function xirr(cashflows){
  if(cashflows.length < 2) return null;
  const first = new Date(cashflows[0].date+"T00:00:00");
  const times = cashflows.map(cf => (new Date(cf.date+"T00:00:00") - first) / (1000*3600*24*365));
  let rate = 0.1;
  for(let iter=0; iter<100; iter++){
    let npv = 0, dnpv = 0;
    cashflows.forEach((cf,i) => {
      const t = times[i];
      npv += cf.amount / Math.pow(1+rate, t);
      dnpv += (t===0) ? 0 : (-t*cf.amount / Math.pow(1+rate, t+1));
    });
    if(Math.abs(dnpv) < 1e-12) break;
    const newRate = rate - npv/dnpv;
    if(!isFinite(newRate)) return null;
    if(Math.abs(newRate-rate) < 1e-8){ rate = newRate; break; }
    rate = newRate;
  }
  return isFinite(rate) ? rate : null;
}

function computePacSimulation(dates, values, initialBalance, pac){
  const N = values.length;
  let units = initialBalance / values[0];
  let totalInvested = initialBalance;
  const investedSeries = [initialBalance];
  const valueSeries = [initialBalance];
  const cashflows = [{date: dates[0], amount: -initialBalance}];

  for(let t=1; t<N; t++){
    if(pac.enabled && pac.amount > 0){
      const kPrev = periodKeyGeneric(dates[t-1], pac.frequency);
      const kCurr = periodKeyGeneric(dates[t], pac.frequency);
      if(kPrev !== kCurr){
        units += pac.amount / values[t];
        totalInvested += pac.amount;
        cashflows.push({date: dates[t], amount: -pac.amount});
      }
    }
    investedSeries.push(totalInvested);
    valueSeries.push(units * values[t]);
  }

  cashflows.push({date: dates[N-1], amount: units * values[N-1]});

  return {
    investedSeries, valueSeries,
    totalInvested, finalValue: units * values[N-1],
    xirrValue: xirr(cashflows)
  };
}


function runMonteCarloSimulation(monthlyReturns, years, startBalance, numSims, fallback){
  numSims = numSims || 1000;
  const rnd = mulberry32(20260101);              // fixed seed: same inputs -> same projection
  const months = Math.round(years * 12);
  const hist = (monthlyReturns || []).filter(x => isFinite(x));
  const useBootstrap = hist.length >= 24;
  const BLOCK = 6;
  const gauss = () => {
    const u1 = rnd() || 1e-9, u2 = rnd();
    return Math.sqrt(-2*Math.log(u1)) * Math.cos(2*Math.PI*u2);
  };
  const paths = [], finals = [];
  for(let s = 0; s < numSims; s++){
    let balance = startBalance;
    const yearEnds = [];
    let m = 0;
    while(m < months){
      if(useBootstrap){
        let k = Math.floor(rnd() * hist.length);   // circular block bootstrap keeps multi-month crashes together
        for(let b = 0; b < BLOCK && m < months; b++, m++){
          balance *= (1 + hist[k]);
          k = (k + 1) % hist.length;
          if(balance < 0) balance = 0;
          if((m + 1) % 12 === 0) yearEnds.push(balance);
        }
      } else {
        balance *= (1 + fallback.mean + fallback.std * gauss());
        if(balance < 0) balance = 0;
        m++;
        if(m % 12 === 0) yearEnds.push(balance);
      }
    }
    paths.push(yearEnds);
    finals.push(balance);
  }
  finals.sort((a,b) => a-b);
  const pct = (p) => finals[Math.min(finals.length-1, Math.floor(p*(finals.length-1)))];
  const yearBands = [];
  for(let y = 0; y < years; y++){
    const v = paths.map(p => p[y]).filter(x => x !== undefined).sort((a,b) => a-b);
    if(!v.length) continue;
    const at = (p) => v[Math.min(v.length-1, Math.floor(p*(v.length-1)))];
    yearBands.push({ year: y+1, p5: at(0.05), p50: at(0.50), p95: at(0.95) });
  }
  return { p5: pct(0.05), p25: pct(0.25), p50: pct(0.50), p75: pct(0.75), p95: pct(0.95), yearBands,
           method: useBootstrap ? "bootstrap" : "normal", historyMonths: hist.length };
}

function computeWithdrawalSimulation(dates, values, initialBalance, w, cpiAt){
  const N = values.length;
  let units = initialBalance / values[0];
  let totalWithdrawn = 0;
  let depleted = false, depletedDate = null, lastWithdrawal = null;
  const balanceSeries = [initialBalance];
  const withdrawnSeries = [0];

  for(let t=1; t<N; t++){
    if(w.enabled && w.amount > 0 && !depleted){
      const kPrev = periodKeyGeneric(dates[t-1], w.frequency);
      const kCurr = periodKeyGeneric(dates[t], w.frequency);
      if(kPrev !== kCurr){
        const currentValue = units * values[t];
        if(currentValue <= 0){
          depleted = true; depletedDate = dates[t]; units = 0;
        } else {
          const amount = (w.indexed && cpiAt) ? w.amount * cpiAt(dates[t]) / cpiAt(dates[0]) : w.amount;
          lastWithdrawal = amount;
          units -= amount / values[t];
          totalWithdrawn += amount;
          if(units <= 0){ units = 0; depleted = true; depletedDate = dates[t]; }
        }
      }
    }
    balanceSeries.push(Math.max(0, units*values[t]));
    withdrawnSeries.push(totalWithdrawn);
  }

  return {
    balanceSeries, withdrawnSeries, totalWithdrawn,
    finalBalance: units*values[N-1],
    depleted, depletedDate, lastWithdrawal, indexed: !!(w.indexed && cpiAt)
  };
}

function mean(arr){ return arr.reduce((a,b)=>a+b,0) / arr.length; }
function periodKeyGeneric(dateStr, mode){  const [y,m] = dateStr.split("-");
  if(mode === "Y") return y;
  if(mode === "Q") return y + "-Q" + Math.ceil(parseInt(m)/3);
  if(mode === "M") return y + "-" + m;
  return null;
}
function stdev(arr){
  const m = mean(arr);
  const variance = arr.reduce((s,v)=> s + (v-m)*(v-m), 0) / (arr.length - 1);
  return Math.sqrt(variance);
}
function correlation(a, b){
  const n = Math.min(a.length, b.length);
  const ma = mean(a.slice(0,n)), mb = mean(b.slice(0,n));
  let num=0, da=0, db=0;
  for(let i=0;i<n;i++){
    num += (a[i]-ma)*(b[i]-mb);
    da += (a[i]-ma)**2;
    db += (b[i]-mb)**2;
  }
  const denom = Math.sqrt(da*db);
  return denom === 0 ? null : num/denom;
}

function covariance(a, b){
  const n = Math.min(a.length, b.length);
  const ma = mean(a.slice(0,n)), mb = mean(b.slice(0,n));
  let s = 0;
  for(let i=0;i<n;i++) s += (a[i]-ma)*(b[i]-mb);
  return s / (n-1);
}

// Rolling annualized returns for fixed windows (1/3/5 years), skipping windows
// longer than the available history. periodsPerYear matches the calc granularity.
function computeRollingReturns(dates, values, periodsPerYear){
  const windows = [1,3,5];
  const N = values.length;
  const results = [];
  windows.forEach(years => {
    const step = Math.round(periodsPerYear * years);
    if(step >= N) return; // not enough history for this window
    const series = [];
    for(let t=step; t<N; t++){
      series.push({ date: dates[t], ret: Math.pow(values[t]/values[t-step], 1/years) - 1 });
    }
    if(!series.length) return;
    const rets = series.map(s => s.ret);
    const avg = mean(rets);
    const min = Math.min(...rets);
    const max = Math.max(...rets);
    const pctPositive = rets.filter(r => r >= 0).length / rets.length;
    results.push({ years, series, avg, min, max, pctPositive });
  });
  return results;
}

function monthDiff(d1, d2){ return (d2.getFullYear()-d1.getFullYear())*12 + (d2.getMonth()-d1.getMonth()); }

async function computeBenchmarkSeries(bp, masterDates, baseCurrency, periodsPerYear){
  const holdings = (bp.holdings||[]).filter(h => h.ticker && h.ticker.trim());
  if(!holdings.length) return null;
  const weightSum = holdings.reduce((s,h)=>s+(parseFloat(h.weight)||0),0) || 1;
  const start = masterDates[0], end = masterDates[masterDates.length-1];

  let results;
  try{
    results = await Promise.all(holdings.map(h =>
      fetch(`/api/history?ticker=${encodeURIComponent(h.ticker)}&start=${start}&end=${end}`).then(r=>r.json())
    ));
  }catch(e){ return null; }
  if(results.some(res => res.error)) return null;

  const seriesByTicker = {};
  holdings.forEach((h,i) => {
    const pts = results[i].points;
    seriesByTicker[h.ticker] = {
      dates: pts.map(pt=>pt.date),
      map: new Map(pts.map(pt=>[pt.date,pt.close])),
      currency: (results[i].currency||"").toUpperCase()
    };
  });

  const foreignCurrencies = Array.from(new Set(
    holdings.map(h => seriesByTicker[h.ticker].currency).filter(c => c && c !== baseCurrency)
  ));
  let fxByCurrency = {};
  if(foreignCurrencies.length){
    try{
      const fxRes = await fetch(`/api/fx?base=${baseCurrency}&symbols=${foreignCurrencies.join(",")}&start=${start}&end=${end}`);
      const fxData = await fxRes.json();
      if(!fxData.error){
        foreignCurrencies.forEach(cur => {
          const map = {};
          Object.keys(fxData.rates||{}).forEach(d => { if(fxData.rates[d][cur]!==undefined) map[d]=fxData.rates[d][cur]; });
          fxByCurrency[cur] = map;
        });
      }
    }catch(e){ /* proceed unconverted if fx fetch fails */ }
  }

  function findOnOrBefore(sortedDates, dateStr){
    let lo=0, hi=sortedDates.length-1, ans=-1;
    while(lo<=hi){ const mid=(lo+hi)>>1; if(sortedDates[mid]<=dateStr){ans=mid; lo=mid+1;} else hi=mid-1; }
    return ans;
  }

  function priceOnOrBefore(ticker, dateStr){
    const {dates, map, currency} = seriesByTicker[ticker];
    const idx = findOnOrBefore(dates, dateStr);
    if(idx === -1) return null;
    let price = map.get(dates[idx]);
    if(currency && currency !== baseCurrency){
      const fxMap = fxByCurrency[currency];
      if(!fxMap) return null;
      const fxDates = Object.keys(fxMap).sort();
      const fIdx = findOnOrBefore(fxDates, dateStr);
      if(fIdx === -1) return null;
      price = price / fxMap[fxDates[fIdx]];
    }
    return price;
  }

  const weights = {};
  holdings.forEach(h => { weights[h.ticker] = (parseFloat(h.weight)||0)/weightSum; });

  const priceGrid = {};
  holdings.forEach(h => {
    const arr = masterDates.map(d => priceOnOrBefore(h.ticker, d));
    const firstIdx = arr.findIndex(v => v !== null);
    if(firstIdx > 0) for(let i=0;i<firstIdx;i++) arr[i] = arr[firstIdx];
    priceGrid[h.ticker] = arr;
  });
  if(holdings.some(h => priceGrid[h.ticker][0] === null || priceGrid[h.ticker][0] === undefined)) return null;

  const N = masterDates.length;
  const shares = {};
  holdings.forEach(h => { shares[h.ticker] = (weights[h.ticker]*100) / priceGrid[h.ticker][0]; });
  const values = new Array(N);
  values[0] = 100;

  function periodKey(dateStr, mode){
    const [y,m] = dateStr.split("-");
    if(mode === "Y") return y;
    if(mode === "Q") return y + "-Q" + Math.ceil(parseInt(m)/3);
    if(mode === "M") return y + "-" + m;
    return null;
  }

  for(let t=1; t<N; t++){
    let val = 0;
    holdings.forEach(h => { val += shares[h.ticker] * priceGrid[h.ticker][t]; });
    values[t] = val;
    let doReb = false;
    if(bp.rebalance === "T"){
      const bBand = Math.max(0.5, parseFloat(bp.rebalanceBand) || 5) / 100;
      if(val > 0) doReb = holdings.some(h => Math.abs(shares[h.ticker]*priceGrid[h.ticker][t]/val - weights[h.ticker]) > bBand);
    } else if(bp.rebalance && bp.rebalance !== "none"){
      doReb = periodKey(masterDates[t-1], bp.rebalance) !== periodKey(masterDates[t], bp.rebalance);
    }
    if(doReb){
      holdings.forEach(h => { shares[h.ticker] = (weights[h.ticker]*val) / priceGrid[h.ticker][t]; });
    }
  }

  const rets = [];
  for(let t=1;t<N;t++) rets.push(values[t]/values[t-1] - 1);
  const yearsSpan = (new Date(masterDates[N-1]) - new Date(masterDates[0])) / (1000*3600*24*365.25);
  const cagr = yearsSpan > 0 ? Math.pow(values[N-1]/values[0], 1/yearsSpan) - 1 : null;
  const annVol = stdev(rets) * Math.sqrt(periodsPerYear);
  let peak = values[0], maxDD = 0;
  for(let t=1;t<N;t++){ peak = Math.max(peak, values[t]); const dd = values[t]/peak - 1; if(dd < maxDD) maxDD = dd; }

  return { name: bp.name, dates: masterDates, values, cagr, annVol, maxDD, totalReturn: values[N-1]/values[0] - 1 };
}

function projectToSimplex(v){
  // Euclidean projection onto { w >= 0, sum w = 1 } (Duchi et al. 2008)
  const u = [...v].sort((a,b) => b-a);
  let css = 0, theta = 0;
  for(let i = 0; i < u.length; i++){
    css += u[i];
    const tt = (css - 1) / (i + 1);
    if(u[i] - tt > 0) theta = tt;
  }
  return v.map(x => Math.max(0, x - theta));
}

function computeEfficientFrontier(instrumentStats, corr, rf){
  const n = instrumentStats.length;
  if(n < 2) return null;
  const mu = instrumentStats.map(s => s.annReturn);
  const vol = instrumentStats.map(s => s.annVol);
  const S = instrumentStats.map((si, i) => instrumentStats.map((sj, j) =>
    i === j ? vol[i]*vol[i] : ((corr[si.ticker] && corr[si.ticker][sj.ticker]) || 0) * vol[i] * vol[j]));
  const evalW = (w) => {
    let ret = 0, v = 0;
    for(let i = 0; i < n; i++){ ret += w[i]*mu[i]; for(let j = 0; j < n; j++) v += w[i]*w[j]*S[i][j]; }
    const sd = Math.sqrt(Math.max(0, v));
    return { w, ret, vol: sd, sharpe: sd > 0 ? (ret - rf)/sd : null };
  };
  // minimise w'Sw - lambda * mu'w over the simplex by projected gradient descent
  const L = 2 * Math.max(...S.map(row => row.reduce((s,x) => s + Math.abs(x), 0))) || 1;
  const solve = (lambda, w0) => {
    let w = w0 ? w0.slice() : new Array(n).fill(1/n);
    for(let it = 0; it < 4000; it++){
      const g = new Array(n);
      for(let i = 0; i < n; i++){ let s = 0; for(let j = 0; j < n; j++) s += S[i][j]*w[j]; g[i] = 2*s - lambda*mu[i]; }
      const nw = projectToSimplex(w.map((x, i) => x - g[i]/L));
      let diff = 0; for(let i = 0; i < n; i++) diff += Math.abs(nw[i] - w[i]);
      w = nw;
      if(diff < 1e-10) break;
    }
    return w;
  };
  const frontierRaw = [];
  let w = solve(0);
  frontierRaw.push(evalW(w));
  for(let k = 0; k < 45; k++){
    const lambda = Math.pow(10, -3 + 5*k/44);
    w = solve(lambda, w);
    frontierRaw.push(evalW(w));
  }
  const frontier = [];
  frontierRaw.sort((a,b) => a.vol - b.vol).forEach(pt => {
    const last = frontier[frontier.length-1];
    if(!last || (pt.ret > last.ret + 1e-7 && pt.vol > last.vol + 1e-7)) frontier.push(pt);
  });
  const minVolPoint = frontier[0];
  // maximum Sharpe: golden-section search over lambda around the best frontier point
  let best = frontier.reduce((a,b) => (b.sharpe ?? -Infinity) > (a.sharpe ?? -Infinity) ? b : a, frontier[0]);
  const sharpeAt = (logL) => { const p = evalW(solve(Math.pow(10, logL), best.w)); return p; };
  let lo = -3, hi = 2;
  for(let it = 0; it < 30; it++){
    const m1 = lo + (hi - lo) * 0.382, m2 = lo + (hi - lo) * 0.618;
    const p1 = sharpeAt(m1), p2 = sharpeAt(m2);
    if((p1.sharpe ?? -Infinity) < (p2.sharpe ?? -Infinity)) lo = m1; else hi = m2;
  }
  const cand = sharpeAt((lo + hi) / 2);
  const maxSharpePoint = (cand.sharpe ?? -Infinity) > (best.sharpe ?? -Infinity) ? cand : best;

  // background cloud of alternative mixes — seeded, so it does not change between runs
  const rnd = mulberry32(1234567);
  const points = [];
  for(let s = 0; s < 1200; s++){
    const e = instrumentStats.map(() => -Math.log(rnd() || 1e-12));
    const sum = e.reduce((a,b) => a+b, 0);
    points.push(evalW(e.map(x => x/sum)));
  }
  return { points, frontier, minVolPoint, maxSharpePoint, tickers: instrumentStats.map(s => s.ticker), method: "optimized" };
}

function computeDrawdownEpisodes(dates, values){
  const episodes = [];
  let peakIdx = 0, peak = values[0];
  let inDD = false, troughIdx = null, troughVal = Infinity, ddStartPeakIdx = 0;
  for(let t=1; t<values.length; t++){
    if(values[t] >= peak){
      if(inDD){
        episodes.push({ peakIdx: ddStartPeakIdx, troughIdx, recoveryIdx: t });
        inDD = false;
      }
      peak = values[t]; peakIdx = t;
    } else {
      if(!inDD){ inDD = true; ddStartPeakIdx = peakIdx; troughVal = Infinity; troughIdx = null; }
      if(values[t] < troughVal){ troughVal = values[t]; troughIdx = t; }
    }
  }
  if(inDD) episodes.push({ peakIdx: ddStartPeakIdx, troughIdx, recoveryIdx: null });

  return episodes.map(e => {
    const peakVal = values[e.peakIdx], trVal = values[e.troughIdx];
    const ddPct = trVal/peakVal - 1;
    const peakDate = new Date(dates[e.peakIdx]+"T00:00:00");
    const troughDate = new Date(dates[e.troughIdx]+"T00:00:00");
    const lengthMonths = monthDiff(peakDate, troughDate) + 1;
    let recoveryMonths = null, underwaterMonths = null, recoveryDate = null;
    if(e.recoveryIdx !== null){
      recoveryDate = new Date(dates[e.recoveryIdx]+"T00:00:00");
      recoveryMonths = monthDiff(troughDate, recoveryDate);
      underwaterMonths = lengthMonths + recoveryMonths;
    }
    return {
      peakDateStr: dates[e.peakIdx], troughDateStr: dates[e.troughIdx],
      recoveryDateStr: e.recoveryIdx!==null ? dates[e.recoveryIdx] : null,
      ddPct, lengthMonths, recoveryMonths, underwaterMonths
    };
  }).filter(e => e.ddPct <= -0.01)
    .sort((a,b) => a.ddPct - b.ddPct)
    .slice(0, 10);
}

const ROLLING_COLORS = { 1: "#1F6F5C", 3: "#3B5B8C", 5: "#A13D2E" };
let rollingChartInstance = null;
function renderRollingReturns(r){
  const wrap = document.getElementById("rollingTableWrap");
  const canvas = document.getElementById("rollingChart");
  const windows = r.rollingReturns || [];

  if(!windows.length){
    wrap.innerHTML = `<p class="status-line">${t("rollingNotEnough")}</p>`;
    if(rollingChartInstance){ rollingChartInstance.destroy(); rollingChartInstance = null; }
    return;
  }

  const pct = (v) => (v*100).toFixed(2)+"%";
  wrap.innerHTML = `
    <table class="dd-table">
      <thead><tr>
        <th>${t("rollingWindow")}</th><th>${t("rollingAvg")}</th><th>${t("rollingMin")}</th>
        <th>${t("rollingMax")}</th><th>${t("rollingPositive")}</th>
      </tr></thead>
      <tbody>
        ${windows.map(w => `<tr>
          <td>${t("rollingYears",{n:w.years})}</td>
          <td>${pct(w.avg)}</td><td>${pct(w.min)}</td><td>${pct(w.max)}</td>
          <td>${(w.pctPositive*100).toFixed(0)}%</td>
        </tr>`).join("")}
      </tbody>
    </table>`;

  if(typeof Chart === "undefined") return;
  const ctx = canvas.getContext("2d");
  if(rollingChartInstance) rollingChartInstance.destroy();
  // use the longest window's date axis as the shared label set; shorter windows
  // simply have fewer leading points (Chart.js aligns by array position, so we
  // pad shorter series with nulls at the start to keep dates aligned)
  const longest = windows.reduce((a,b) => a.series.length > b.series.length ? a : b);
  const labels = longest.series.map(s => s.date);
  const datasets = windows.map(w => {
    const data = labels.map((d, i) => {
      const idx = i - (labels.length - w.series.length);
      return idx >= 0 ? w.series[idx].ret*100 : null;
    });
    return {
      label: t("rollingYears",{n:w.years}), data,
      borderColor: ROLLING_COLORS[w.years], backgroundColor: "transparent",
      pointRadius: 0, borderWidth: 1.4, tension: 0.05, spanGaps: false
    };
  });
  rollingChartInstance = new Chart(ctx, {
    type: "line",
    data: { labels, datasets },
    options: {
      animation: false, responsive: true, maintainAspectRatio: false,
      scales: {
        x: { ticks: { color: chartAxisColor(), maxTicksLimit: 8, font:{family:"IBM Plex Mono", size:10} }, grid:{display:false} },
        y: { ticks: { color: chartAxisColor(), font:{family:"IBM Plex Mono", size:10}, callback:v=>v+"%" }, grid:{color:chartGridColor()} }
      },
      plugins: { legend: { display:true, position:"bottom", labels:{boxWidth:8, color: chartLegendColor(), font:{family:"Inter", size:11}} } }
    }
  });
}

  block.style.display = "";

  const years = p.monteCarloYears || 20;
  const startBalance = parseFloat(p.initialBalance) || 10000;
  const monthly = (r.monthlyExport && r.monthlyExport.portfolioReturns) || [];
  const mMean = monthly.length ? mean(monthly) : r.periodMean * r.periodsPerYear / 12;
  const mStd = monthly.length > 1 ? stdev(monthly) : r.periodStd * Math.sqrt(r.periodsPerYear / 12);
  const mc = runMonteCarloSimulation(monthly, years, startBalance, 1000, { mean: mMean, std: mStd });

  if(mcNoteEl) mcNoteEl.textContent = mc.method === "bootstrap" ? t("mcNote", {months: mc.historyMonths}) : t("mcNoteNormal");

  const sym = r.currencySymbol || "€";
  const fmt = (v) => sym + Math.round(v).toLocaleString(locale());

let corrChartInstance = null;
function renderCorrelationChart(r){
  const titleEl = document.getElementById("corrBlockTitle");
  if(titleEl) titleEl.textContent = t("correlationTitle", {freq: r.granularity === "M" ? t("corrFreqMonthly") : t("corrFreqDaily")});
  const canvas = document.getElementById("corrChart");
  if(!canvas) return;
  if(typeof Chart === "undefined" || !Chart.registry.controllers.get("matrix")){
    canvas.closest(".block-body").innerHTML = `<p class="status-line error">${t("matrixLibMissing")}</p>`;
    return;
  }
  const ctx = canvas.getContext("2d");
  if(corrChartInstance) corrChartInstance.destroy();

  const tickers = r.tickers;
  const nameByTicker = {};
  (r.instrumentStats||[]).forEach(s => { nameByTicker[s.ticker] = s.name || s.ticker; });
  const data = [];
  tickers.forEach(t1 => { tickers.forEach(t2 => { data.push({ x: t1, y: t2, v: r.corr[t1][t2] }); }); });

  const colorFor = (v) => {
    if(v === null || isNaN(v)) return "rgba(0,0,0,0.05)";
    const tv = Math.max(-1, Math.min(1, v));
    return tv >= 0 ? `rgba(31,111,92,${(0.15 + tv*0.65).toFixed(2)})` : `rgba(161,61,46,${(0.15 + (-tv)*0.65).toFixed(2)})`;
  };

  corrChartInstance = new Chart(ctx, {
    type: "matrix",
    data: {
      datasets: [{
        label: "Correlazione", data,
        backgroundColor: (c) => colorFor(c.raw.v),
        borderColor: chartSurfaceColor(), borderWidth: 2,
        width: ({chart}) => (chart.chartArea || {}).width / tickers.length - 2,
        height: ({chart}) => (chart.chartArea || {}).height / tickers.length - 2
      }]
    },
    options: {
      animation: false, responsive: true, maintainAspectRatio: false,
      scales: {
        x: { type:"category", labels: tickers, ticks:{color: chartAxisColor(), font:{family:"IBM Plex Mono", size:10}}, grid:{display:false} },

      },
      plugins: {
        legend: { display:false },
        tooltip: { callbacks: {
          title: () => "",
          label: (c) => `${c.raw.x} (${nameByTicker[c.raw.x]||''}) × ${c.raw.y} (${nameByTicker[c.raw.y]||''}): ${c.raw.v===null?'—':c.raw.v.toFixed(2)}`
        } }
      }
    }
  });

  const keyEl = document.getElementById("corrTickerKey");
  if(keyEl){
    keyEl.innerHTML = tickers.map(tk => `<span style="margin-right:16px; display:inline-block;"><span class="mono" style="font-family:var(--font-mono); font-weight:600;">${escapeHtml(tk)}</span> — ${escapeHtml(nameByTicker[tk]||"")}</span>`).join("");

    cell(t("metricInitial"), `${r.currencySymbol}${Math.round(r.startBalance).toLocaleString(locale())}`) +
    cell(t("metricFinal"), `${r.currencySymbol}${Math.round(r.endBalance).toLocaleString(locale())}`, null, r.endBalance>=r.startBalance?"pos":"neg") +
    cell(t("metricTotalReturn"), pct(r.totalReturn), null, r.totalReturn>=0?"pos":"neg") +
    cell(t("metricCagr"), pct(r.cagr), null, r.cagr>=0?"pos":"neg") +
    cell(t("metricVol"), pct(r.annVol)) +
    cell(t("metricSharpe"), r.sharpe===null?"—":r.sharpe.toFixed(2)) +
    cell(t("metricSortino"), r.sortino===null?"—":r.sortino.toFixed(2)) +
    cell(t("metricMaxDD"), pct(r.maxDD), null, "neg") +
    cell(t("metricBestYear"), pct(r.bestYear.ret), r.bestYear.year, "pos") +
    cell(t("metricWorstYear"), pct(r.worstYear.ret), r.worstYear.year, "neg") +
    (r.realCagr != null ? cell(t("metricRealCagr"), pct(r.realCagr), t("inflationSub", {month: r.inflationThrough}), r.realCagr>=0?"pos":"neg") : "") +
    (r.inflationAvg != null ? cell(t("metricInflation"), pct(r.inflationAvg)) : "") +
    cell(t("metricPeriod"), `${r.effectiveStart.slice(0,4)}–${r.effectiveEnd.slice(0,4)}`,
      `${r.dates.length} ${r.granularity==='M' ? t('months') : t('days')}` + (r.limiting && r.limiting.length ? ` · ${t("limitedBy", {list: r.limiting.join(", ")})}` : ""));
}

function escapeHtml(s){
  return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

function exportMonthlyReturnsCSV(p){
  const r = p.lastResult;
  if(!r || !r.monthlyExport) return;
  const ex = r.monthlyExport;
  const header = [t("colMonth"), ...ex.tickers.map(tk => `${tk} (%)`), `${t("colPortfolio")} (%)`];
  const rows = ex.dates.map((d, i) => {
    const vals = ex.tickers.map(tk => (ex.instrumentReturns[tk][i]*100).toFixed(2));
    return [d.slice(0,7), ...vals, (ex.portfolioReturns[i]*100).toFixed(2)];
  });
  const csv = [header, ...rows].map(row => row.join(";")).join("\n");
  const blob = new Blob(["\uFEFF" + csv], {type:"text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `rendimenti-mensili-${p.name.replace(/[^a-z0-9]+/gi,"_")}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

/* ============================= INIT ============================= */
async function bootstrap(){
  try{
    const res = await fetch("/api/state");
    const data = await res.json();
    if(data && data.exists && data.state){
      // server is the source of truth once it has data
      state = Object.assign(loadState(), data.state);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } else if(state.portfolios.length || state.clients.length){
      // server has nothing yet but the browser does: migrate it up once
      fetch("/api/state", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(state)
      }).catch(() => {});
    }
  }catch(err){
    // server not reachable (e.g. running index.html without server.py) — carry on with localStorage only
    console.warn("Could not reach /api/state, using local data:", err);
  }

  if(!state.lang) state.lang = "it";
  if(!state.theme) state.theme = "light";
  if(!state.clients) state.clients = [];
  if(!state.view) state.view = "portfolios";
  document.documentElement.setAttribute("data-theme", state.theme);

  if(!state.portfolios.length){
    const p = newPortfolio("Portafoglio 1");
    state.portfolios.push(p);
    state.selectedId = p.id;
    saveState();
  }
  if(!state.selectedId && state.portfolios.length){
    state.selectedId = state.portfolios[0].id;
  }
  renderAll();
}
bootstrap();
</script>
