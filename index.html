<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portafogli — Andamento storico v1.3</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231F6F5C'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-chart-matrix@2"></script>
<style>
  :root{
    --bg: #F1F2EA;
    --bg-sidebar: #E9EAE0;
    --surface: #FFFFFF;
    --surface-alt: #F8F8F3;
    --border: #DBDACD;
    --border-strong: #B9B8A8;
    --ink: #16202A;
    --ink-muted: #58626F;
    --ink-faint: #8A93A0;
    --accent: #1F6F5C;
    --accent-deep: #164E40;
    --accent-soft: #E4EFEA;
    --negative: #A13D2E;
    --negative-soft: #F5E7E3;
    --shadow-1: 0 1px 2px rgba(22,32,42,0.05);
    --shadow-2: 0 4px 16px rgba(22,32,42,0.07), 0 1px 3px rgba(22,32,42,0.06);
    --radius: 10px;
    --radius-sm: 6px;
    --emphasis-bg: #16202A;
    --font-display: "Source Serif 4", Georgia, serif;
    --font-ui: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  :root[data-theme="dark"]{
    --bg: #14181D;
    --bg-sidebar: #191D23;
    --surface: #1D2128;
    --surface-alt: #21262E;
    --border: #2E333B;
    --border-strong: #3C424C;
    --ink: #E6E9EC;
    --ink-muted: #A6AEB8;
    --ink-faint: #767F8A;
    --accent: #3FA98A;
    --accent-deep: #2C8069;
    --accent-soft: #1D332C;
    --negative: #D9695A;
    --negative-soft: #3A241F;
    --shadow-1: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-2: 0 4px 16px rgba(0,0,0,0.35), 0 1px 3px rgba(0,0,0,0.3);
    --emphasis-bg: #3FA98A;
  }
  *{box-sizing:border-box;}
  *, *::before, *::after{ box-sizing:border-box; }
  input, select, textarea{ max-width:100%; min-width:0; }
  html,body{margin:0;padding:0; max-width:100%;}
  body{
    overflow-x:hidden;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-ui);
    font-size:14px;
    line-height:1.5;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  ::selection{ background:var(--accent-soft); color:var(--accent-deep); }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--border-strong); border-radius:5px; }

  .app{
    display:grid;
    grid-template-columns:minmax(0, 258px) minmax(0, 1fr);
    min-height:100vh;
    width:100%;
    max-width:100%;
    overflow-x:hidden;
  }
  html, body{
    width:100%;
    max-width:100%;
    overflow-x:hidden;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    background:var(--bg-sidebar);
    border-right:1px solid var(--border);
    padding:24px 16px;
    display:flex;
    flex-direction:column;
    gap:14px;
    position:sticky;
    top:0;
    max-height:100vh;
    overflow:hidden;
  }
  .wordmark-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .wordmark{
    font-family:var(--font-display);
    font-size:20px;
    font-weight:600;
    letter-spacing:-0.01em;
    display:flex;
    align-items:center;
    gap:9px;
  }
  .wordmark::before{
    content:"";
    display:block;
    width:9px; height:9px;
    border-radius:2px;
    background:var(--accent);
    flex-shrink:0;
    box-shadow:0 0 0 3px var(--accent-soft);
  }
  .wordmark-text{ display:flex; flex-direction:column; }
  .wordmark small{
    display:block;
    font-family:var(--font-ui);
    font-size:10.5px;
    font-weight:500;
    color:var(--ink-faint);
    letter-spacing:0.01em;
    margin-top:3px;
  }
  .lang-toggle{ display:flex; border:1px solid var(--border-strong); border-radius:14px; overflow:hidden; flex-shrink:0; background:var(--surface); }
  .lang-toggle button{
    border:none; background:none; padding:4px 9px; font-size:11px; font-weight:600;
    color:var(--ink-muted); cursor:pointer; font-family:var(--font-mono); transition:background .12s,color .12s;
  }
  .lang-toggle button.active{ background:var(--emphasis-bg); color:#fff; }

  .portfolio-list{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:1px;
    overflow-y:auto;
    min-height:0;
    flex:1;
  }
  .portfolio-list li{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:2px;
    border-radius:6px;
    position:relative;
    background:transparent;
    transition:background .12s;
    user-select:none;
  }
  .portfolio-list li.drag-source{ opacity:.45; }
  .portfolio-list li.drag-over{ box-shadow:inset 0 2px 0 0 var(--accent); }
  .portfolio-list li.drag-over-below{ box-shadow:inset 0 -2px 0 0 var(--accent); }
  .portfolio-list li:not(.drag-source):hover{ background:var(--surface); }
  .drag-handle{
    background:none;
    border:none;
    color:var(--ink-faint);
    cursor:grab;
    font-size:13px;
    padding:4px 2px 4px 7px;
    line-height:1;
    flex-shrink:0;
    transition:color .12s;
    touch-action:none;
  }
  .drag-handle:hover{ color:var(--ink); }
  .sidebar-io-row{
    display:flex;
    gap:8px;
    border-top:1px solid var(--border);
    padding-top:14px;
  }
  .sidebar-io-row button{ flex:1; font-size:11.5px; margin-top:0; }
  .sidebar-footer{
    font-size:10.5px;
    color:var(--ink-faint);
    text-align:center;
    padding-top:2px;
  }
  .compare-modal{
    position:fixed; inset:0; background:rgba(22,32,42,0.45);
    display:flex; align-items:center; justify-content:center; z-index:1000;
  }
  .compare-modal-inner{
    background:var(--surface); border-radius:8px; width:420px; max-width:90vw;
    max-height:80vh; display:flex; flex-direction:column; box-shadow:0 20px 50px rgba(0,0,0,0.25);
  }
  .compare-modal-header{
    padding:16px 20px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
    font-weight:600; font-family:var(--font-display); font-size:17px;
  }
  .compare-modal-close{ background:none; border:none; font-size:20px; cursor:pointer; color:var(--ink-faint); }
  .compare-modal-close:hover{ color:var(--negative); }
  .compare-modal-body{ padding:14px 20px; overflow-y:auto; flex:1; }
  .compare-item{ display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); font-size:13.5px; }
  .compare-item:last-child{ border-bottom:none; }
  .compare-item.disabled{ color:var(--ink-faint); }
  .compare-item .hint{ font-size:11px; color:var(--ink-faint); margin-left:auto; }
  .compare-modal-footer{ padding:14px 20px; border-top:1px solid var(--border); }
  .compare-modal-footer .btn-calc{ width:100%; margin-left:0; }
  .portfolio-item-btn{
    flex:1;
    text-align:left;
    background:none;
    border:none;
    border-left:2px solid transparent;
    padding:8px 10px 8px 9px;
    border-radius:0 5px 5px 0;
    font-family:var(--font-ui);
    font-size:13.5px;
    color:var(--ink-muted);
    cursor:pointer;
    transition:background .12s,color .12s,border-color .12s;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .portfolio-item-btn:hover{ background:var(--surface); color:var(--ink); }
  .portfolio-item-btn.active{
    background:var(--surface);
    color:var(--accent-deep);
    font-weight:600;
    border-left-color:var(--accent);
    box-shadow:var(--shadow-1);
  }
  .portfolio-del{
    background:none;
    border:none;
    color:var(--ink-faint);
    cursor:pointer;
    font-size:15px;
    padding:4px 8px;
    line-height:1;
    opacity:0.55;
    transition:opacity .12s,color .12s;
  }
  .portfolio-list li:hover .portfolio-del{ opacity:1; }
  .portfolio-del:hover{ color:var(--negative); }
  .btn-add-portfolio{
    border:1px dashed var(--border-strong);
    background:none;
    color:var(--ink-muted);
    padding:10px;
    border-radius:var(--radius-sm);
    font-family:var(--font-ui);
    font-size:13px;
    font-weight:500;
    cursor:pointer;
    transition:border-color .12s,color .12s,background .12s;
  }
  .btn-add-portfolio:hover{ border-color:var(--accent); color:var(--accent-deep); border-style:solid; background:var(--accent-soft); }
  .btn-add-portfolio.btn-primary{
    border:1px solid var(--accent);
    background:var(--accent);
    color:#fff;
    font-weight:600;
  }
  .btn-add-portfolio.btn-primary:hover{ background:var(--accent-deep); border-color:var(--accent-deep); color:#fff; }
  .sidebar-io-row button, .btn-add-portfolio.btn-secondary{
    border-style:solid;
    opacity:.85;
  }
  .sidebar-io-row button:hover{ opacity:1; }

  /* ---------- Main ---------- */
  .main{ padding:30px 32px 80px; width:100%; max-width:100%; margin:0; min-width:0; overflow-x:clip; }
  .empty-state{
    padding:100px 20px;
    text-align:center;
    color:var(--ink-muted);
    border:1px dashed var(--border-strong);
    border-radius:var(--radius);
    background:var(--surface-alt);
  }
  .empty-state h2{ font-family:var(--font-display); font-weight:600; font-size:21px; color:var(--ink); margin:0 0 8px; }
  .empty-state p{ margin:0; }
  .empty-state-inline{
    padding:40px 24px;
    text-align:center;
    color:var(--ink-muted);
    border:1px dashed var(--border-strong);
    border-radius:var(--radius);
    background:var(--surface-alt);
  }
  .empty-state-inline .empty-icon{
    width:36px; height:36px;
    margin:0 auto 12px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--accent-soft);
    color:var(--accent-deep);
  }
  .empty-state-inline .empty-icon svg{ width:18px; height:18px; }
  .empty-state-inline h3{ font-family:var(--font-display); font-weight:600; font-size:15.5px; color:var(--ink); margin:0 0 5px; }
  .empty-state-inline p{ margin:0; font-size:12.5px; line-height:1.5; }

  .portfolio-title-row{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:26px;
    padding-bottom:18px;
    border-bottom:1px solid var(--border);
  }
  .portfolio-title{
    font-family:var(--font-display);
    font-size:28px;
    font-weight:600;
    border:none;
    border-bottom:1px solid transparent;
    background:none;
    color:var(--ink);
    padding:2px 0;
    min-width:120px;
    transition:border-color .12s;
  }
  .portfolio-title:hover{ border-bottom-color:var(--border-strong); }
  .portfolio-title:focus{ outline:none; border-bottom:1px solid var(--accent); }
  .weight-badge{
    font-family:var(--font-mono);
    font-size:12px;
    padding:4px 11px 4px 9px;
    border-radius:12px;
    border:1px solid var(--border-strong);
    color:var(--ink-muted);
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-left:auto;
    white-space:nowrap;
  }
  .weight-badge::before{ content:""; width:6px; height:6px; border-radius:50%; background:var(--ink-faint); }
  .weight-badge.ok{ border-color:var(--accent); color:var(--accent-deep); background:var(--accent-soft); }
  .weight-badge.ok::before{ background:var(--accent); }
  .weight-badge.warn{ border-color:var(--negative); color:var(--negative); background:var(--negative-soft); }
  .weight-badge.warn::before{ background:var(--negative); }

  section.block{
    border:1px solid var(--border);
    border-radius:var(--radius);
    background:var(--surface);
    margin-bottom:22px;
    box-shadow:var(--shadow-1);
    overflow:hidden;
  }
  .block-header{
    padding:14px 20px;
    border-bottom:1px solid var(--border);
    background:var(--surface-alt);
    font-size:12px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--ink-muted);
  }
  .block-header.collapsible{
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    user-select:none;
  }
  .block-header.collapsible .chevron{
    font-size:11px;
    transition:transform .15s;
    transform:rotate(-90deg);
    display:inline-block;
  }
  .block-header.collapsible.open .chevron{ transform:rotate(0deg); }
  .block-body{ padding:20px 22px; }
  .block-grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:24px; }
  @media (max-width: 1100px){ .block-grid-2{ grid-template-columns:1fr; } }
  .yearly-grid{ grid-template-columns:minmax(160px, 220px) 1fr; }
  @media (max-width: 700px){ .yearly-grid{ grid-template-columns:1fr; } }

  table.holdings{
    width:100%;
    max-width:100%;
    border-collapse:collapse;
    table-layout:fixed;
    /* hard stop: never grow past parent */
  }
  .composition-table-wrap table.holdings{
    width:100%;
    min-width:0;
  }
  table.holdings th{
    text-align:left;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:var(--ink-faint);
    font-weight:600;
    padding:0 8px 9px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  table.holdings td{
    padding:5px 8px;
    border-top:1px solid var(--border);
    vertical-align:middle;
    overflow:hidden;
    word-break:break-word;
    overflow-wrap:anywhere;
  }
  table.holdings td.col-actions{ width:36px; max-width:36px; text-align:center; }
  table.holdings tbody tr:nth-child(even){ background:var(--surface-alt); }
  table.holdings tbody tr:hover{ background:var(--accent-soft); }
  table.holdings input[type=text], table.holdings input[type=number]{
    width:100% !important;
    max-width:100% !important;
    min-width:0 !important;
    box-sizing:border-box;
    border:1px solid transparent;
    background:transparent;
    padding:7px 8px;
    font-family:var(--font-ui);
    font-size:13.5px;
    border-radius:5px;
    color:var(--ink);
    transition:background .12s,border-color .12s;
  }
  table.holdings input:hover{ background:var(--bg); }
  table.holdings input:focus{ outline:none; border-color:var(--accent); background:var(--surface); }
  td.col-weight{ width:11%; }
  td.col-weight input{ font-family:var(--font-mono); text-align:right; font-weight:600; }
  td.col-ticker{ font-family:var(--font-mono); font-size:13px; color:var(--ink-muted); width:12%; }
  td.col-isin{ width:18%; position:relative; }
  td.col-name{ width:24%; }
  td.col-class{ width:16%; }
  .resolve-status{
    font-size:11.5px;
    color:var(--ink-faint);
    padding:2px 8px 0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    max-width:100%;
  }
  .resolve-status.found{ color:var(--accent-deep); }
  .resolve-status.missing{ color:var(--negative); }
  .candidate-list{
    list-style:none;
    margin:4px 0 0;
    padding:0;
    border:1px solid var(--border-strong);
    border-radius:var(--radius-sm);
    background:var(--surface);
    box-shadow:var(--shadow-2);
    position:absolute;
    left:0;
    right:auto;
    z-index:20;
    width:min(340px, 70vw);
    max-width:min(340px, 70vw);
    max-height:220px;
    overflow-y:auto;
    overflow-x:hidden;
  }
  .candidate-list li{
    padding:7px 10px;
    font-size:12.5px;
    cursor:pointer;
    border-top:1px solid var(--border);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .candidate-list li:first-child{ border-top:none; }
  .candidate-list li:hover{ background:var(--accent-soft); }
  .candidate-list .sym{ font-family:var(--font-mono); font-weight:600; margin-right:6px; }
  .candidate-list .exch{ color:var(--ink-faint); float:right; margin-left:8px; }
  .row-remove{
    background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size:15px; border-radius:4px; padding:2px 5px;
    transition:color .12s,background .12s;
  }
  .row-remove:hover{ color:var(--negative); background:var(--negative-soft); }
  .btn-add-row{
    margin-top:12px;
    border:1px dashed var(--border-strong);
    background:none;
    padding:8px 13px;
    border-radius:var(--radius-sm);
    font-size:13px;
    font-weight:500;
    color:var(--ink-muted);
    cursor:pointer;
    transition:border-color .12s,color .12s,background .12s;
  }
  .btn-add-row:hover{ border-color:var(--accent); color:var(--accent-deep); background:var(--accent-soft); border-style:solid; }

  .controls-row{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(190px, 1fr));
    gap:20px 24px;
    align-items:start;
    min-width:0;
  }
  .controls-row .control-group{
    min-width:0;
    max-width:100%;
    overflow:visible;
  }
  .controls-row .control-group.span-2{ grid-column: span 2; }
  @media (max-width: 700px){
    .controls-row .control-group.span-2{ grid-column: span 1; }
    .controls-row .pac-box, .controls-row .wd-box{ grid-column: span 1 !important; }
  }
  .controls-row .control-group input[type=text],
  .controls-row .control-group .date-inputs,
  .controls-row .control-group select,
  .controls-row .control-group .num-input{ max-width:100%; width:100%; box-sizing:border-box; }
  .controls-row .btn-calc{
    margin-left:0;
    grid-column: 1 / -1;
    justify-self:end;
    width:auto;
    min-width:140px;
  }
  .controls-row .pac-box, .controls-row .wd-box{
    border:1px solid var(--border);
    background:var(--surface-alt);
    border-radius:var(--radius-sm);
    padding:12px 14px;
    min-width:240px;
    max-width:100%;
    grid-column: span 2;
  }
  .controls-row .pac-label{
    display:flex;
    align-items:flex-start;
    gap:8px;
    font-size:12px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:var(--ink-muted);
    line-height:1.3;
    margin-bottom:10px;
    text-transform:none;
    letter-spacing:0;
    font-size:12.5px;
  }
  .controls-row .pac-label input[type=checkbox]{
    margin-top:2px;
    flex-shrink:0;
  }
  .controls-row .pac-fields{
    display:flex;
    flex-direction:row;
    align-items:center;
    gap:8px;
    min-width:0;
  }
  .controls-row .pac-amount{
    width:92px !important;
    min-width:92px !important;
    max-width:92px !important;
    flex:0 0 92px;
  }
  .controls-row .pac-freq{
    width:auto !important;
    min-width:130px;
    max-width:none;
    flex:1 1 auto;
  }
  .results-tabs{
    display:flex;
    gap:4px;
    border-bottom:1px solid var(--border);
    margin-bottom:18px;
  }
  .results-tab-btn{
    border:none;
    background:none;
    padding:10px 16px;
    font-size:12.5px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:var(--ink-faint);
    cursor:pointer;
    border-bottom:2px solid transparent;
    margin-bottom:-1px;
    transition:color .12s, border-color .12s;
  }
  .results-tab-btn:hover{ color:var(--ink-muted); }
  .results-tab-btn.active{ color:var(--accent-deep); border-bottom-color:var(--accent); }
  .tab-panel{ display:none; }
  .tab-panel.active{ display:block; }
  .heat-table{ border-collapse:collapse; width:100%; font-size:11.5px; }
  .heat-table th, .heat-table td{ padding:4px 3px; text-align:center; font-family:var(--font-mono); }
  .heat-table th{ color:var(--ink-faint); font-family:var(--font-ui); font-size:10px; text-transform:uppercase; }
  .heat-table td.y{ text-align:left; color:var(--ink-muted); font-weight:600; }
  .annual-asset-table{ width:100%; max-width:100%; border-collapse:collapse; font-size:12.5px; table-layout:auto; }
  #instrumentYearlyTableWrap, #yearlyTableWrap, #ddTableWrap, #rollingTableWrap, #frontierTableWrap{

const STORAGE_KEY = "portfolioTrackerData";
const INSTRUMENT_CACHE_KEY = "portfolioInstrumentCache";

function loadInstrumentCache(){
  try{
    const raw = localStorage.getItem(INSTRUMENT_CACHE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {};
}
let instrumentCache = loadInstrumentCache();
function saveInstrumentCache(){ localStorage.setItem(INSTRUMENT_CACHE_KEY, JSON.stringify(instrumentCache)); }
function cacheKey(q){ return (q||"").trim().toUpperCase(); }
function getCachedInstrument(q){ return instrumentCache[cacheKey(q)] || null; }
function setCachedInstrument(q, entry){
  const k = cacheKey(q);
  if(!k) return;
  instrumentCache[k] = Object.assign({}, instrumentCache[k], entry);
  saveInstrumentCache();
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { portfolios: [], clients: [], selectedId: null, lang: "it", theme: "light", view: "portfolios", activeClientId: null };
}
let saveDebounceTimer = null;
function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  clearTimeout(saveDebounceTimer);
  saveDebounceTimer = setTimeout(() => {
    fetch("/api/state", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(state)
    }).catch(() => { /* server not reachable — localStorage still has it, will retry on next save */ });
  }, 400);
}

let dragSrcId = null;

function renderSidebar(){
  const list = document.getElementById("portfolioList");
  list.innerHTML = "";
  state.portfolios.forEach(p => {
    const li = document.createElement("li");
    li.draggable = true;
    li.dataset.portfolioId = p.id;

    const handle = document.createElement("span");
    handle.className = "drag-handle";
    handle.title = "Riordina";
    handle.innerHTML = "&#x2807;";

    const btn = document.createElement("button");
    btn.className = "portfolio-item-btn" + (p.id === state.selectedId ? " active" : "");
    btn.textContent = p.name || t("noNamePortfolio");
    btn.onclick = () => { state.selectedId = p.id; saveState(); renderAll(); };

    const dup = document.createElement("button");
    dup.className = "portfolio-del";
    dup.innerHTML = "&#x29C9;";
    dup.title = t("duplicatePortfolioTitle");
    dup.onclick = (e) => {
      e.stopPropagation();
      duplicatePortfolio(p.id);
    };

    const del = document.createElement("button");
    del.className = "portfolio-del";
    del.innerHTML = "&times;";
    del.title = t("deletePortfolioTitle");
    del.onclick = (e) => {
      e.stopPropagation();
      if(!confirm(t("deleteConfirm", {name: p.name}))) return;
      state.portfolios = state.portfolios.filter(x => x.id !== p.id);
      if(state.selectedId === p.id){
        state.selectedId = state.portfolios.length ? state.portfolios[0].id : null;
      }
      saveState(); renderAll();
    };

    li.appendChild(handle);
    li.appendChild(btn);
    li.appendChild(dup);
    li.appendChild(del);

    li.addEventListener("dragstart", (e) => {
      dragSrcId = p.id;
      li.classList.add("drag-source");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", p.id);
    });
    li.addEventListener("dragend", () => {
      dragSrcId = null;
      list.querySelectorAll("li").forEach(x => x.classList.remove("drag-source","drag-over","drag-over-below"));
    });
    li.addEventListener("dragover", (e) => {
      e.preventDefault();
      if(!dragSrcId || dragSrcId === p.id) return;
      const rect = li.getBoundingClientRect();
      const above = (e.clientY - rect.top) < rect.height / 2;
      li.classList.toggle("drag-over", above);
      li.classList.toggle("drag-over-below", !above);
      e.dataTransfer.dropEffect = "move";
    });
    li.addEventListener("dragleave", () => {
      li.classList.remove("drag-over","drag-over-below");
    });
    li.addEventListener("drop", (e) => {
      e.preventDefault();
      li.classList.remove("drag-over","drag-over-below");
      if(!dragSrcId || dragSrcId === p.id) return;
      const rect = li.getBoundingClientRect();
      const above = (e.clientY - rect.top) < rect.height / 2;
      const from = state.portfolios.findIndex(x => x.id === dragSrcId);
      if(from === -1) return;
      const [moved] = state.portfolios.splice(from, 1);
      let to = state.portfolios.findIndex(x => x.id === p.id);
      if(!above) to += 1;
      state.portfolios.splice(to, 0, moved);
      saveState();
      renderAll();
    });

    list.appendChild(li);
  });
}

function duplicatePortfolio(id){
  const src = state.portfolios.find(x => x.id === id);
  if(!src) return;
  const clone = JSON.parse(JSON.stringify(src));
  clone.id = uid();
  clone.name = t("duplicateSuffix", {name: src.name});
  clone.holdings.forEach(h => { h.id = uid(); });
  clone.benchmarkId = (src.benchmarkId === undefined) ? null : src.benchmarkId;
  state.portfolios.push(clone);
  state.selectedId = clone.id;
  saveState(); renderAll();
}

document.getElementById("fileImport").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const parsed = JSON.parse(text);
    const list = Array.isArray(parsed) ? parsed : [parsed];
    const imported = [];
    for(const raw of list){
      const p = newPortfolio(raw.name || "Portafoglio importato");
      if(raw.rebalance) p.rebalance = raw.rebalance;
      if(raw.riskFree !== undefined) p.riskFree = raw.riskFree;
      if(raw.riskFreeAuto !== undefined) p.riskFreeAuto = raw.riskFreeAuto;
      if(raw.initialBalance !== undefined) p.initialBalance = raw.initialBalance;
      if(raw.currencySymbol) p.currencySymbol = raw.currencySymbol;
      if(raw.granularity) p.granularity = raw.granularity;
      if(raw.benchmarkType) p.benchmarkType = raw.benchmarkType;
      if(raw.benchmarkTicker) p.benchmarkTicker = raw.benchmarkTicker;
      if(raw.pac) p.pac = Object.assign({enabled:false, amount:100, frequency:"M"}, raw.pac);
      if(raw.withdrawal) p.withdrawal = Object.assign({enabled:false, amount:100, frequency:"M"}, raw.withdrawal);
      if(raw.reportContent) p.reportContent = Object.assign(newReportContent(), raw.reportContent);
      if(raw.timeframe) p.timeframe = raw.timeframe;
      p.holdings = (raw.holdings || []).map(h => newHolding(h.isin, h.weight, h.assetClass));
      p.holdings.forEach((h, i) => {
        const src = raw.holdings[i];
        if(src.ticker){ h.ticker = src.ticker; h.name = src.name || src.ticker; h.resolveState = "found"; }
      });
      imported.push(p);
      state.portfolios.push(p);
    }
    state.selectedId = imported[0].id;
    saveState(); renderAll();

    for(const p of imported){
      for(const h of p.holdings){
        if(h.ticker || !h.isin) continue;

        const cached = getCachedInstrument(h.isin);
        if(cached){
          h.ticker = cached.ticker;
          h.name = cached.name;
          h.assetClass = h.assetClass || cached.assetClass || "";
          h.resolveState = "found";
          saveState();
          if(state.selectedId === p.id) renderMain();
          continue;
        }

        try{
          const res = await fetch(`/api/resolve?q=${encodeURIComponent(h.isin)}`);
          const data = await res.json();
          if(data.candidates && data.candidates.length){
            h.ticker = data.candidates[0].symbol;
            h.name = data.candidates[0].name;
            h.resolveState = "found";
            setCachedInstrument(h.isin, { ticker: h.ticker, name: h.name });
            saveState();
            if(state.selectedId === p.id) renderMain();
            await autoClassify(p, h, data.candidates[0].name, data.candidates[0].type);
          } else {
            h.resolveState = "missing";
          }
        }catch(err){ h.resolveState = "missing"; }
        saveState();
        if(state.selectedId === p.id) renderMain();
      }
    }
  }catch(err){
    alert(t("invalidFile", {msg: err.message}));
  } finally {
    e.target.value = "";
  }
});

/* ---- Auto asset-class classification via yfinance ---- */
async function autoClassify(p, h, hintName, hintType){
  if(h.assetClass || !h.ticker) return;
  const cached = getCachedInstrument(h.isin || h.ticker);
  if(cached && cached.assetClass){
    h.assetClass = cached.assetClass;
    saveState();
    if(state.selectedId === p.id) renderMain();
    return;
  }

  // fast path: classify directly from data we already have (search result hint),
  // no network round-trip needed
  if(hintName){
    const guess = classifyFromNameType(hintName, hintType);
    if(guess){
      h.assetClass = guess;
      setCachedInstrument(h.isin || h.ticker, { assetClass: guess });
      saveState();
      if(state.selectedId === p.id) renderMain();
      return;
    }
  }

  // fallback: look the ticker up via the (reliable) search endpoint to get a
  // name/quoteType to classify from, for tickers entered manually
  try{
    const res = await fetch(`/api/resolve?q=${encodeURIComponent(h.ticker)}`);
    const data = await res.json();
    const candidates = data.candidates || [];
    const match = candidates.find(c => (c.symbol||"").toUpperCase() === h.ticker.toUpperCase()) || candidates[0];
    if(match){
      const guess = classifyFromNameType(match.name, match.type);
      if(guess){
        h.assetClass = guess;
        setCachedInstrument(h.isin || h.ticker, { assetClass: guess });
        saveState();
        if(state.selectedId === p.id) renderMain();
      }
    }
  }catch(err){ /* best-effort: leave the field blank for manual entry */ }
}

function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

  en: { prudent:"Prudent", moderate:"Moderate", balanced:"Balanced", dynamic:"Dynamic", aggressive:"Aggressive" }
};

/* ---------- small helpers ---------- */
function clIsoDate(d){ return d.toISOString().slice(0,10); }
function clNum(v){ const n = parseFloat(v); return isFinite(n) ? n : 0; }
function clMoney(v, ccy, dec){
  if(v===null || v===undefined || !isFinite(v)) return "—";
  const d = dec===undefined ? 0 : dec;
  try{ return new Intl.NumberFormat(locale(), {style:"currency", currency: ccy||"EUR", minimumFractionDigits:d, maximumFractionDigits:d}).format(v); }
  catch(e){ return v.toFixed(d)+" "+(ccy||""); }
}
function clPct(v, dec, signed){
  if(v===null || v===undefined || !isFinite(v)) return "—";
  const s = (v*100).toFixed(dec===undefined?1:dec);
  return (signed && v>0 ? "+" : "") + s + "%";
}
function clPts(v){ if(v===null || v===undefined || !isFinite(v)) return "—"; return (v>0?"+":"")+(v*100).toFixed(1); }
function clPrice(v, ccy){
  if(v===null || v===undefined || !isFinite(v)) return "—";
  return v.toLocaleString(locale(), {minimumFractionDigits:2, maximumFractionDigits:4}) + (ccy ? " "+ccy : "");
}
function clUnits(v){
  if(!isFinite(v)) return "—";
  const a = Math.abs(v);
  return a.toLocaleString(locale(), {maximumFractionDigits: Number.isInteger(a) ? 0 : 4});
}
function clDateTime(iso){
  if(!iso) return "—";
  try{ return new Date(iso).toLocaleString(locale(), {day:"2-digit", month:"2-digit", year:"2-digit", hour:"2-digit", minute:"2-digit"}); }
  catch(e){ return iso; }
}
function clDate(iso){
  if(!iso) return "—";
  try{ return new Date(iso+"T00:00:00").toLocaleDateString(locale(), {day:"2-digit", month:"short", year:"numeric"}); }
  catch(e){ return iso; }
}
function clRiskLabel(k){ return (CL_RISK_LABEL[state.lang] || CL_RISK_LABEL.it)[k] || ""; }
function clIsIsin(s){ return /^[A-Z]{2}[A-Z0-9]{9}[0-9]$/.test((s||"").trim().toUpperCase()); }
function clToast(title, msg, type){ if(typeof showToast === "function") showToast(title, msg||"", type||"success"); }

/* ---------- data model ---------- */
function clNewClient(){
  return {
    id: uid(), name: t("clNewName"), email:"", phone:"", riskProfile:"", horizon:"",
    modelId:"", baseCurrency:"EUR", driftThreshold:5, nextReview:"", notes:"",
    cash:0, positions:[], transactions:[], fxRates:{}, pricesAsOf:null,
    createdAt: new Date().toISOString()
  };
}
function clNewPosition(){
  return { id: uid(), isin:"", ticker:"", name:"", assetClass:"", quantity:0, avgCost:0,
           currency:"", lastPrice:null, lastPriceBase:null, priceDate:null };
}
function clNormalize(c){
  if(!c || typeof c !== "object") return null;
  const n = Object.assign(clNewClient(), c);
  if(!n.modelId && c.portfolioId) n.modelId = c.portfolioId;      // legacy field
  delete n.portfolioId;
  n.positions = (Array.isArray(c.positions) ? c.positions : []).map(p => {
    const q = Object.assign(clNewPosition(), p);
    q.id = p.id || uid();
    q.quantity = p.quantity !== undefined ? clNum(p.quantity) : clNum(p.units);   // legacy "units"
    q.avgCost = clNum(p.avgCost !== undefined ? p.avgCost : p.costBasis);
    delete q.units; delete q.valueOverride; delete q.costBasis;
    return q;
  });
  n.transactions = Array.isArray(c.transactions) ? c.transactions : [];
  n.fxRates = (c.fxRates && typeof c.fxRates === "object") ? c.fxRates : {};
  n.driftThreshold = clNum(c.driftThreshold) || 5;
  n.baseCurrency = CL_CCY.includes(c.baseCurrency) ? c.baseCurrency : "EUR";
  n.cash = clNum(c.cash);
  return n;
}
function clEnsureState(){
  if(clNormalizedFor === state) return;
  if(!Array.isArray(state.clients)) state.clients = [];
  state.clients = state.clients.map(clNormalize).filter(Boolean);
  clNormalizedFor = state;
}
function clGet(){ return (state.clients||[]).find(c => c.id === state.activeClientId) || null; }
function clModel(c){ return c && c.modelId ? (state.portfolios.find(p => p.id === c.modelId) || null) : null; }
function clToBase(amount, ccy, base, fx){
  if(amount===null || amount===undefined || !isFinite(amount)) return null;
  if(!ccy || ccy === base) return amount;
  const r = fx && fx[ccy];
  return r ? amount / r : null;
}
function clTargets(model){
  if(!model) return [];
  const hs = (model.holdings||[]).filter(h => (h.ticker||"").trim() && clNum(h.weight) > 0);
  const sum = hs.reduce((s,h) => s + clNum(h.weight), 0) || 1;
  return hs.map(h => ({
    isin: (h.isin||"").trim().toUpperCase(),
    ticker: h.ticker.trim().toUpperCase(),
    name: h.name || h.ticker,
    assetClass: h.assetClass || "",
    weight: clNum(h.weight) / sum
  }));
}
// Match a client position to a model line by ISIN first (same fund on another
// exchange is the same instrument), then by ticker.
function clMatchIndex(p, targets){
  const pi = (p.isin||"").trim().toUpperCase(), pt = (p.ticker||"").trim().toUpperCase();
  let i = pi ? targets.findIndex(tg => tg.isin && tg.isin === pi) : -1;
  if(i < 0 && pt) i = targets.findIndex(tg => tg.ticker === pt);
  return i;
}

/* ---------- valuation ---------- */
function clValuation(c){
  const base = c.baseCurrency || "EUR";
  const targets = clTargets(clModel(c));
  const rows = (c.positions||[]).map(p => {
    const qty = clNum(p.quantity);
    const value = p.lastPriceBase != null ? qty * p.lastPriceBase : null;
    const costNative = qty * clNum(p.avgCost);
    const costBase = costNative > 0 ? clToBase(costNative, p.currency, base, c.fxRates) : null;
    const pnl = (value != null && costBase != null) ? value - costBase : null;
    const pnlPct = (p.lastPrice != null && clNum(p.avgCost) > 0) ? p.lastPrice / clNum(p.avgCost) - 1 : null;
    return { p, qty, value, costBase, pnl, pnlPct, targetIdx: clMatchIndex(p, targets) };
  });
  const cash = clNum(c.cash);
  const invested = rows.reduce((s,r) => s + (r.value||0), 0);
  const total = invested + cash;
  const withPnl = rows.filter(r => r.pnl != null);
  const cost = withPnl.reduce((s,r) => s + r.costBase, 0);
  const pnl = withPnl.length ? withPnl.reduce((s,r) => s + r.pnl, 0) : null;
  const pnlPct = (pnl != null && cost > 0) ? pnl / cost : null;
  rows.forEach(r => { r.weight = (total > 0 && r.value != null) ? r.value / total : null; });
  const tv = targets.map(() => 0);
  rows.forEach(r => { if(r.targetIdx >= 0 && r.value != null) tv[r.targetIdx] += r.value; });
  const alloc = targets.map((tg,i) => ({
    ...tg, current: total > 0 ? tv[i]/total : 0, dev: (total > 0 ? tv[i]/total : 0) - tg.weight,
    held: rows.some(r => r.targetIdx === i && r.qty > 0)
  }));
  const off = rows.filter(r => r.targetIdx < 0 && r.qty > 0 && r.value != null).map(r => ({
    ticker: r.p.ticker, isin: r.p.isin, name: r.p.name || r.p.ticker, assetClass: r.p.assetClass,
    weight: 0, current: r.weight || 0, dev: r.weight || 0, off: true
  }));
  const maxDrift = (targets.length && total > 0) ? Math.max(0, ...[...alloc, ...off].map(a => Math.abs(a.dev))) : null;
  const missing = rows.filter(r => r.qty > 0 && r.value == null).map(r => r.p.ticker || r.p.isin || "?");
  return { base, rows, cash, invested, total, cost, pnl, pnlPct, targets, alloc, off, maxDrift, missing };
}

/* ---------- quotes & FX ---------- */
async function clFetchQuote(ticker){
  const end = clIsoDate(new Date());
  const start = clIsoDate(new Date(Date.now() - 20*864e5));
  const res = await fetch(`/api/history?ticker=${encodeURIComponent(ticker)}&start=${start}&end=${end}`);
  const data = await res.json();
  const pts = data.points || [];
  if(!pts.length) return null;
  let price = pts[pts.length-1].close;
  let cur = (data.currency || "").trim();
  if(cur === "GBp" || cur === "GBX"){ price = price / 100; cur = "GBP"; }   // London quotes in pence
  return { price, currency: cur.toUpperCase(), date: pts[pts.length-1].date };
}
async function clFetchFx(base, ccys){
  const need = [...new Set(ccys.filter(x => x && x !== base))];
  if(!need.length) return {};
  const end = clIsoDate(new Date());
  const start = clIsoDate(new Date(Date.now() - 14*864e5));
  const res = await fetch(`/api/fx?base=${base}&symbols=${need.join(",")}&start=${start}&end=${end}`);
  const ct = res.headers.get("content-type") || "";
  if(!res.ok || !ct.includes("json")) throw new Error("fx");
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  const dates = Object.keys(data.rates || {}).sort();
  const out = {};
  need.forEach(cur => {
    for(let i = dates.length-1; i >= 0; i--){
      const r = data.rates[dates[i]][cur];
      if(r){ out[cur] = r; break; }
    }
  });
  return out;
}
async function clRefresh(c){
  if(!c) return [];
  const base = c.baseCurrency || "EUR";
  const tickers = [...new Set([
    ...(c.positions||[]).map(p => (p.ticker||"").trim().toUpperCase()),
    ...clTargets(clModel(c)).map(tg => tg.ticker)
  ].filter(Boolean))];
  if(!tickers.length) return [];
  const failed = [];
  await Promise.all(tickers.map(async tk => {
    try{ const q = await clFetchQuote(tk); if(q) clQuotes[tk] = q; else failed.push(tk); }
    catch(e){ failed.push(tk); }
  }));
  const ccys = tickers.map(tk => clQuotes[tk] && clQuotes[tk].currency).filter(Boolean);
  try{ c.fxRates = Object.assign({}, c.fxRates || {}, await clFetchFx(base, ccys)); }
  catch(e){ failed.push("FX"); }
  (c.positions||[]).forEach(p => {
    const q = clQuotes[(p.ticker||"").trim().toUpperCase()];
    if(!q) return;
    p.lastPrice = q.price; p.currency = q.currency; p.priceDate = q.date;
    p.lastPriceBase = clToBase(q.price, q.currency, base, c.fxRates);
  });
  c.pricesAsOf = new Date().toISOString();
  saveState();
  return failed;
}
async function clRefreshAndRender(c){
  clUI.status = t("clPricesUpdating");
  clPaintStatus();
  const failed = await clRefresh(c);
  clUI.status = failed.length
    ? t("clPriceMissing", {list: failed.join(", ")})
    : t("clPricesUpdated", {time: new Date().toLocaleTimeString(locale(), {hour:"2-digit", minute:"2-digit"})});
  if(state.view === "clients") renderClientsApp();
}
function clPaintStatus(){
  const el = document.getElementById("clStatus");
  if(el) el.textContent = clUI.status || "";
}

/* ---------- rebalancing engine ---------- */
// opts: { mode: "invest" | "rebalance", contribution, wholeUnits }
function clBuildPlan(c, model, opts, quotes){
  quotes = quotes || clQuotes;
  const base = c.baseCurrency || "EUR";
  const mode = opts.mode === "rebalance" ? "rebalance" : "invest";
  const targets = clTargets(model);
  const posIdx = {};
  (c.positions||[]).forEach(p => { posIdx[p.id] = clMatchIndex(p, targets); });

  const curVal = targets.map(() => 0);
  const offLines = [];
  const unpriced = [];
  let invested = 0;
  (c.positions||[]).forEach(p => {
    const qty = clNum(p.quantity);
    if(qty <= 0) return;
    if(p.lastPriceBase == null){ unpriced.push(p.ticker || p.isin || "?"); return; }
    const val = qty * p.lastPriceBase;
    invested += val;
    const i = posIdx[p.id];
    if(i >= 0) curVal[i] += val;
    else offLines.push({ off:true, ticker:p.ticker, isin:p.isin||"", name:p.name||p.ticker, assetClass:p.assetClass||"",
      posId:p.id, targetWeight:0, targetValue:0, currentValue:val, priceBase:p.lastPriceBase,
      priceNative:p.lastPrice, currency:p.currency||"", heldQty:qty, amount:0 });
  });

  const contribution = Math.max(0, clNum(opts.contribution));
  const spendable = Math.max(0, clNum(c.cash)) + contribution;
  const total = invested + spendable;
  const missing = [];

  const lines = targets.map((tg, i) => {
    // Prefer the listing the client already holds; otherwise the model's listing.
    const held = (c.positions||[])
      .filter(p => posIdx[p.id] === i && clNum(p.quantity) > 0 && p.lastPriceBase != null)
      .sort((a,b) => clNum(b.quantity)*b.lastPriceBase - clNum(a.quantity)*a.lastPriceBase)[0];
    let priceBase = null, priceNative = null, currency = "", ticker = tg.ticker;
    if(held){ priceBase = held.lastPriceBase; priceNative = held.lastPrice; currency = held.currency||""; ticker = held.ticker; }
    else if(quotes[tg.ticker]){
      const q = quotes[tg.ticker];
      priceNative = q.price; currency = q.currency||"";
      priceBase = clToBase(q.price, currency, base, c.fxRates);
    }
    if(!(priceBase > 0)){ priceBase = null; missing.push(tg.ticker); }
    return { off:false, ticker, isin: tg.isin || (held ? held.isin||"" : ""), name: tg.name, assetClass: tg.assetClass,
      posId: held ? held.id : null, targetWeight: tg.weight, currentValue: curVal[i], targetValue: tg.weight*total,
      priceBase, priceNative, currency, heldQty: held ? clNum(held.quantity) : 0, amount: 0 };
  });

  const priced = lines.filter(l => l.priceBase);
  if(mode === "invest"){
    const def = priced.map(l => Math.max(0, l.targetValue - l.currentValue));
    const dsum = def.reduce((a,b) => a+b, 0);
    const wsum = priced.reduce((s,l) => s + l.targetWeight, 0) || 1;
    priced.forEach((l,k) => {
      if(dsum <= 1e-9) l.amount = spendable * l.targetWeight / wsum;
      else if(spendable >= dsum) l.amount = def[k] + (spendable - dsum) * l.targetWeight / wsum;
      else l.amount = spendable * def[k] / dsum;
    });
  } else {
    priced.forEach(l => { l.amount = l.targetValue - l.currentValue; });
    offLines.forEach(l => { l.amount = -l.currentValue; });
  }

  const all = mode === "rebalance" ? [...lines, ...offLines] : lines;
  all.forEach(l => {
    if(!l.priceBase){ l.units = 0; l.amount = 0; return; }
    if(l.off){ l.units = -l.heldQty; l.amount = l.units * l.priceBase; return; }
    let u = l.amount / l.priceBase;
    if(opts.wholeUnits) u = u > 0 ? Math.floor(u + 1e-9) : -Math.floor(-u + 1e-9);
    if(u < 0) u = Math.max(u, -l.heldQty);          // never sell more than held
    l.units = u; l.amount = u * l.priceBase;
  });

  let leftover = spendable - all.reduce((s,l) => s + l.amount, 0);
  const after = l => l.currentValue + l.amount;
  const buyable = all.filter(l => !l.off && l.priceBase);
  if(opts.wholeUnits){
    let guard = 0;
    while(leftover < -0.005 && guard++ < 100000){       // overspent: drop units from most overweight buys
      const cands = buyable.filter(l => l.units >= 1);
      if(!cands.length) break;
      cands.sort((a,b) => (after(b) - b.targetValue) - (after(a) - a.targetValue));
      const l = cands[0]; l.units -= 1; l.amount -= l.priceBase; leftover += l.priceBase;
    }
    guard = 0;
    while(guard++ < 100000){                             // deploy remaining cash one unit at a time
      const cands = buyable.filter(l => l.priceBase <= leftover + 0.005);
      if(!cands.length) break;
      cands.sort((a,b) => (b.targetValue - after(b)) - (a.targetValue - after(a)));
      const l = cands[0]; l.units += 1; l.amount += l.priceBase; leftover -= l.priceBase;
    }
  } else if(leftover < -0.005){
    const buys = all.filter(l => l.amount > 0);
    const bsum = buys.reduce((s,l) => s + l.amount, 0);
    const k = bsum > 0 ? Math.max(0, (bsum + leftover) / bsum) : 1;
    buys.forEach(l => { l.amount *= k; l.units = l.amount / l.priceBase; });
    leftover = spendable - all.reduce((s,l) => s + l.amount, 0);
  }

  all.forEach(l => {
    l.afterValue = l.currentValue + l.amount;
    l.currentWeight = total > 0 ? l.currentValue / total : 0;
    l.afterWeight = total > 0 ? l.afterValue / total : 0;
    l.action = Math.abs(l.units) < 1e-9 ? "hold" : (l.units > 0 ? "buy" : "sell");
  });
  const buys = all.reduce((s,l) => s + (l.amount > 0 ? l.amount : 0), 0);
  const sells = all.reduce((s,l) => s + (l.amount < 0 ? -l.amount : 0), 0);
  return { clientId: c.id, mode, base, total, spendable, contribution, buys, sells,
           leftover: Math.max(0, leftover), lines: all, missing: [...new Set(missing)], unpriced,
           wholeUnits: !!opts.wholeUnits, pricesAsOf: c.pricesAsOf };
}

function clApplyPlan(c, plan){
  const today = clIsoDate(new Date());
  const txns = [];
  if(plan.contribution > 0) txns.push({ id: uid(), date: today, type: "DEPOSIT", amountBase: plan.contribution, currency: plan.base });
  plan.lines.forEach(l => {
    if(l.action === "hold") return;
    const u = l.units;
    let pos = l.posId ? c.positions.find(p => p.id === l.posId) : null;
    if(u > 0){
      if(pos){
        const q = clNum(pos.quantity), nq = q + u;
        pos.avgCost = nq > 0 ? (q*clNum(pos.avgCost) + u*clNum(l.priceNative)) / nq : clNum(l.priceNative);
        pos.quantity = nq;
      } else {
        pos = Object.assign(clNewPosition(), { isin: l.isin||"", ticker: l.ticker, name: l.name, assetClass: l.assetClass||"",
          quantity: u, avgCost: clNum(l.priceNative), currency: l.currency||"", lastPrice: l.priceNative,
          lastPriceBase: l.priceBase, priceDate: today });
        c.positions.push(pos);
      }
    } else if(pos){
      pos.quantity = Math.max(0, clNum(pos.quantity) + u);
    }
    txns.push({ id: uid(), date: today, type: u > 0 ? "BUY" : "SELL", ticker: l.ticker, isin: l.isin||"", name: l.name,
      units: Math.abs(u), price: l.priceNative, currency: l.currency||"", amountBase: Math.abs(l.amount) });
  });
  c.positions = c.positions.filter(p => clNum(p.quantity) > 1e-9 || !(p.ticker||"").trim());
  c.cash = Math.round(plan.leftover * 100) / 100;
  c.transactions = [...txns, ...(c.transactions||[])];
  saveState();
}

/* ---------- file helpers ---------- */
function clDownload(filename, text, mime){
  const blob = new Blob([text], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.target = "_self";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function clSlug(s){ return (s||"cliente").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/gi,"-").replace(/^-|-$/g,"").toLowerCase(); }

    try{

      if(!list) throw new Error("format");
      const incoming = list.map(clNormalize).filter(Boolean);

      const byId = new Map(state.clients.map(c => [c.id, c]));

      saveState();

      renderClientsApp();

      clToast(t("clImportError"), "", "error");
    }finally{ e.target.value = ""; }
  };

function clWireIsinSearch(tr, p, c){
  const inp = tr.querySelector('input[data-f="isin"]');
  const status = tr.querySelector(".resolve-status");
  let timer = null;
  const pick = (query, ticker, name, type) => {
    p.ticker = (ticker||"").toUpperCase();
    p.name = name || p.name;
    if(clIsIsin(query)) p.isin = query.trim().toUpperCase();
    if(!p.assetClass){
      const cached = getCachedInstrument(query);
      p.assetClass = (cached && cached.assetClass) || classifyFromNameType(name, type) || "";
    }
    p.lastPrice = null; p.lastPriceBase = null; p.currency = ""; p.priceDate = null;
    setCachedInstrument(query, { ticker: p.ticker, name: p.name });
    clUI.plan = null;
    saveState();
    clRefreshAndRender(c);
  };
  inp.onchange = () => { p.isin = inp.value.trim().toUpperCase(); saveState(); };
  inp.oninput = () => {
    clearTimeout(timer);
    const q = inp.value.trim();
    if(q.length < 3){ status.innerHTML = ""; return; }
    const cached = getCachedInstrument(q);
    if(cached && cached.ticker){ status.textContent = ""; pick(q, cached.ticker, cached.name, ""); return; }
    status.className = "resolve-status";
    status.textContent = t("clSearching");
    timer = setTimeout(async () => {
      try{
        const res = await fetch(`/api/resolve?q=${encodeURIComponent(q)}`);
        const data = await res.json();
        const cands = data.candidates || [];
        if(!cands.length){ status.textContent = t("clNoResults"); return; }
        status.innerHTML = "";
        const ul = document.createElement("ul");
        ul.className = "candidate-list";
        cands.slice(0, 8).forEach(cd => {
          const li = document.createElement("li");
          li.innerHTML = `<span class="sym">${escapeHtml(cd.symbol)}</span>${escapeHtml(cd.name)}<span class="exch">${escapeHtml(cd.exchange||"")}</span>`;
          li.onclick = () => pick(q, cd.symbol, cd.name, cd.type);
          ul.appendChild(li);
        });
        status.appendChild(ul);
      }catch(e){ status.textContent = t("networkError"); }
    }, 450);
  };
}

function clRenderAllocation(el, c, v){
  const byClass = {};
  v.rows.forEach(r => {
    if(r.value == null || r.value <= 0) return;
    const k = (r.p.assetClass || "").trim() || t("unclassified");
    byClass[k] = (byClass[k] || 0) + r.value;
  });
  if(v.cash > 0) byClass[t("clCashRow")] = (byClass[t("clCashRow")] || 0) + v.cash;
  const labels = Object.keys(byClass);
  const values = labels.map(k => byClass[k]);
  const colors = labels.map((_, i) => ALLOCATION_PALETTE[i % ALLOCATION_PALETTE.length]);

  let tableHtml;
  if(!v.targets.length){
    tableHtml = `<p class="note" style="margin-top:0;">${t("clNoModelAssigned")}</p>`;
  } else {
    const thr = clNum(c.driftThreshold || 5) / 100;
    const items = [...v.alloc, ...v.off].sort((a,b) => Math.abs(b.dev) - Math.abs(a.dev));
    tableHtml = `<div class="cl-scroll"><table class="cl-table">
      <thead><tr><th>${t("clColName")}</th><th class="num">${t("clColCurrentW")}</th><th class="num">${t("clColTarget")}</th><th class="num">${t("clColDev")}</th></tr></thead>
      <tbody>${items.map(a => `<tr>
        <td><span class="tk">${escapeHtml(a.ticker || a.isin || "")}</span> ${escapeHtml(a.name || "")}
          ${a.off ? ` <span class="cl-tag">${t("clOffModel")}</span>` : (!a.held ? ` <span class="cl-tag">${t("clNotHeld")}</span>` : "")}</td>
        <td class="num">${clPct(a.current)}</td>
        <td class="num">${clPct(a.weight)}</td>
        <td class="num ${Math.abs(a.dev) > thr ? "cl-warn" : ""}">${clPts(a.dev)}</td>
      </tr>`).join("")}</tbody></table></div>`;
  }

  el.innerHTML = `<div class="cl-alloc">
      <div>
        <div class="chart-wrap"><canvas id="clDonut"></canvas></div>
        <div class="pie-legend">${labels.map((k,i) => `<div class="pie-legend-item"><span class="pie-legend-swatch" style="background:${colors[i]}"></span><span>${escapeHtml(k)}</span><span class="pie-legend-pct">${clPct(v.total > 0 ? values[i]/v.total : 0)}</span></div>`).join("") || `<div class="pie-legend-item">${t("pieEmpty")}</div>`}</div>
      </div>
      <div>${tableHtml}</div>
    </div>`;

  if(typeof Chart === "undefined" || !labels.length) return;
  if(clDonutChart) clDonutChart.destroy();
  clDonutChart = new Chart(document.getElementById("clDonut").getContext("2d"), {
    type: "doughnut",
    data: { labels, datasets: [{ data: values, backgroundColor: colors, borderColor: chartSurfaceColor(), borderWidth: 1.5 }] },
    options: { animation:false, responsive:true, maintainAspectRatio:false, cutout:"60%",
      plugins: { legend:{display:false}, tooltip:{ callbacks:{ label: (ctx) => `${ctx.label}: ${clMoney(ctx.parsed, v.base)}` } } } }
  });
}

function clPaintPlan(el, c, plan){
  const base = plan.base;
  const cell = (label, value, cls) => `<div class="metric-cell"><div class="metric-label">${label}</div><div class="metric-value ${cls||""}">${value}</div></div>`;
  const order = { sell: 0, buy: 1, hold: 2 };
  const lines = [...plan.lines].sort((a,b) => (order[a.action] - order[b.action]) || (Math.abs(b.amount) - Math.abs(a.amount)));
  const active = lines.filter(l => l.action !== "hold");
  const warn = [];
  if(plan.missing.length) warn.push(t("clNeedPrices", {list: plan.missing.join(", ")}));
  if(plan.unpriced.length) warn.push(t("clUnpriced", {list: plan.unpriced.join(", ")}));

  el.innerHTML = `
    <div class="metrics-grid" style="margin-top:20px;">
      ${cell(t("clSumSpendable"), clMoney(plan.spendable, base, 2))}
      ${cell(t("clSumBuys"), clMoney(plan.buys, base, 2), plan.buys > 0 ? "pos" : "")}
      ${cell(t("clSumSells"), clMoney(plan.sells, base, 2), plan.sells > 0 ? "neg" : "")}
      ${cell(t("clSumLeft"), clMoney(plan.leftover, base, 2))}
    </div>
    ${warn.map(w => `<div class="status-line error">${escapeHtml(w)}</div>`).join("")}
    ${active.length ? "" : `<p class="note">${t("clNothingToDo")}</p>`}
    <div class="cl-scroll" style="margin-top:14px;">
      <table class="cl-table">
        <thead><tr>
          <th>${t("clColAction")}</th><th>${t("clColName")}</th><th class="num">${t("clColUnits")}</th>
          <th class="num">${t("clColPrice")}</th><th class="num">${t("clColAmount")} (${base})</th>
          <th class="num">${t("clColWeightNow")}</th><th class="num">${t("clColWeightAfter")}</th><th class="num">${t("clColTarget")}</th>
        </tr></thead>
        <tbody>${lines.map(l => `<tr>
          <td><span class="cl-act ${l.action}">${l.action === "buy" ? t("clBuy") : (l.action === "sell" ? t("clSell") : t("clHold"))}</span></td>
          <td><span class="tk">${escapeHtml(l.ticker)}</span> ${escapeHtml(l.name || "")}${l.off ? ` <span class="cl-tag">${t("clOffModel")}</span>` : ""}${l.isin ? `<span class="sub">${escapeHtml(l.isin)}</span>` : ""}</td>
          <td class="num">${l.action === "hold" ? "—" : clUnits(l.units)}</td>
          <td class="num">${clPrice(l.priceNative, l.currency)}</td>
          <td class="num ${l.amount > 0.005 ? "cl-pos" : (l.amount < -0.005 ? "cl-neg" : "")}">${l.action === "hold" ? "—" : clMoney(Math.abs(l.amount), base, 2)}</td>
          <td class="num">${clPct(l.currentWeight)}</td>
          <td class="num">${clPct(l.afterWeight)}</td>
          <td class="num">${l.off ? "0,0%" : clPct(l.targetWeight)}</td>
        </tr>`).join("")}</tbody>
      </table>
    </div>
    <div class="cl-planfoot">
      <button class="cl-btn" id="clExportPlan" ${active.length ? "" : "disabled"}>${t("clExportCsv")}</button>
      <button class="cl-btn primary" id="clApplyPlan" ${active.length ? "" : "disabled"}>${t("clApply")}</button>
      <span class="cl-muted" style="font-size:12px;">${t("clStale", {time: clDateTime(plan.pricesAsOf)})}</span>
    </div>`;

  document.getElementById("clExportPlan").onclick = () => {
    const head = ["Operazione","ISIN","Ticker","Strumento","Quote","Prezzo","Valuta","Importo " + base];
    const rows = active.map(l => [
      l.action === "buy" ? t("clBuy") : t("clSell"), l.isin || "", l.ticker, (l.name || "").replace(/;/g, ","),
      Math.abs(l.units).toFixed(4).replace(".", ","), (l.priceNative != null ? l.priceNative.toFixed(4) : "").replace(".", ","),
      l.currency || "", Math.abs(l.amount).toFixed(2).replace(".", ",")
    ]);
    clDownload(`operazioni-${clSlug(c.name)}-${clIsoDate(new Date())}.csv`,
      "\uFEFF" + [head, ...rows].map(r => r.join(";")).join("\n"), "text/csv;charset=utf-8");
  };
  document.getElementById("clApplyPlan").onclick = () => {
    if(!confirm(t("clApplyConfirm"))) return;
    clApplyPlan(c, plan);
    clUI.plan = null; clUI.contribution = 0;
    clToast(t("clApplied"));
    clUI.tab = "positions";
    renderClientsApp();
  };
}

function showToast(title, msg, type){
  const container = document.getElementById("toastContainer");
  if(!container) return;
  const el = document.createElement("div");
  el.className = "toast" + (type === "error" ? " toast-error" : "");
  const icon = type === "error"
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 8"/></svg>`;
  el.innerHTML = `
    <div class="toast-icon">${icon}</div>
    <div class="toast-body">
      <div class="toast-title">${escapeHtml(title)}</div>
      ${msg ? `<div class="toast-msg">${escapeHtml(msg)}</div>` : ""}
    </div>`;
  container.appendChild(el);
  requestAnimationFrame(() => el.classList.add("show"));
  const remove = () => {
    el.classList.remove("show");
    setTimeout(() => el.remove(), 220);
  };
  setTimeout(remove, 3200);
}
function switchResultsTab(group){
  document.querySelectorAll(".results-tab-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.group === group);
  });
  document.querySelectorAll(".tab-panel").forEach(panel => {
    panel.classList.toggle("active", panel.dataset.group === group);
  });
}
function setCollapsibleState(headerId, bodyId, open){
  const header = document.getElementById(headerId);
  const body = document.getElementById(bodyId);
  if(!header || !body) return;
  body.style.display = open ? "" : "none";
  header.classList.toggle("open", open);
}
function toggleCollapsible(headerId, bodyId){
  const body = document.getElementById(bodyId);
  const isOpen = body.style.display !== "none";
  setCollapsibleState(headerId, bodyId, !isOpen);
}

function renderHoldingsRows(p){
  const body = document.getElementById("holdingsBody");
  body.innerHTML = "";
  p.holdings.forEach(h => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="col-isin">
        <input type="text" size="1" placeholder="${t('isinPlaceholder')}" value="${escapeAttr(h.isin)}" />
        <div class="resolve-status ${h.resolveState==='found'?'found':(h.resolveState==='missing'?'missing':'')}"></div>
      </td>
      <td class="col-ticker"><input type="text" size="1" placeholder="${t('tickerPlaceholder')}" value="${escapeAttr(h.ticker)}" /></td>
      <td class="col-name"><input type="text" size="1" placeholder="${t('instrumentPlaceholder')}" value="${escapeAttr(h.name)}" /></td>
      <td class="col-class"><input type="text" size="1" list="assetClassSuggestions" placeholder="${t('classPlaceholder')}" value="${escapeAttr(h.assetClass||'')}" /></td>
      <td class="col-weight"><input type="number" size="1" step="0.1" value="${h.weight}" /></td>
      <td class="col-actions"><button class="row-remove" title="${t('removeTitle')}">&times;</button></td>
    `;
    const isinInput = tr.querySelector(".col-isin input");
    const statusDiv = tr.querySelector(".resolve-status");
    const tickerInput = tr.querySelector(".col-ticker input");
    const nameInput = tr.querySelector(".col-name input");
    const classInput = tr.querySelector(".col-class input");
    const weightInput = tr.querySelector(".col-weight input");
    const removeBtn = tr.querySelector(".row-remove");

    isinInput.onchange = () => { h.isin = isinInput.value; saveState(); };
    let debounceTimer = null;
    isinInput.addEventListener("input", () => {
      h.isin = isinInput.value;
      clearTimeout(debounceTimer);
      const q = isinInput.value.trim();
      if(q.length < 3){ statusDiv.textContent = ""; return; }

      const cached = getCachedInstrument(q);
      if(cached){
        h.ticker = cached.ticker;
        h.name = cached.name;
        if(cached.assetClass) h.assetClass = h.assetClass || cached.assetClass;
        h.resolveState = "found";
        saveState();
        statusDiv.className = "resolve-status found";
        statusDiv.textContent = t("fromCache", {ticker: cached.ticker});
        tickerInput.value = cached.ticker;
        nameInput.value = cached.name;
        classInput.value = h.assetClass || "";
        renderAllocationChart(p);
        return;
      }

      statusDiv.textContent = t("searching");
      debounceTimer = setTimeout(() => resolveHolding(p, h, q, statusDiv, tr), 500);
    });
    tickerInput.onchange = () => {
      h.ticker = tickerInput.value.toUpperCase();
      saveState();
      if(h.isin && h.ticker) setCachedInstrument(h.isin, { ticker: h.ticker, name: h.name || h.ticker });
      if(h.ticker) autoClassify(p, h);
    };
    nameInput.onchange = () => {
      h.name = nameInput.value;
      saveState();
      if(h.isin && h.ticker) setCachedInstrument(h.isin, { ticker: h.ticker, name: h.name || h.ticker });
    };
    classInput.onchange = () => {
      h.assetClass = classInput.value;
      saveState();
      if(h.isin || h.ticker) setCachedInstrument(h.isin || h.ticker, { assetClass: h.assetClass });
      renderAllocationChart(p);
    };
    weightInput.onchange = () => { h.weight = parseFloat(weightInput.value)||0; saveState(); renderMain(); };
    removeBtn.onclick = () => { p.holdings = p.holdings.filter(x => x.id !== h.id); saveState(); renderMain(); };

    body.appendChild(tr);
  });
}

// Same best-effort keyword classifier as server.py's _CLASSIFY_RULES, applied
// client-side to data we already have from /api/resolve (name + quoteType) so
// classification doesn't need its own network round-trip to a Yahoo endpoint
// that often requires auth we don't have.
const CLASSIFY_RULES = [
  ["Oro", ["gold","precious metal","silver","platinum","palladium"]],
  ["Immobiliare", ["real estate","reit","property","real asset"]],
  ["Materie Prime", ["commodit","broad basket","natural resources","energy fund"]],
  ["Liquidità", ["money market","ultrashort","cash management","treasury bill"]],
  ["Alternativi", ["preferred","convertible","multialternative","market neutral","long/short","hedge fund"]],
  ["Obbligazionario", ["bond","fixed income","duration","credit","treasury","gilt","muni","debt fund"]],
  ["Azionario", ["equity","stock","blend","growth","value","large cap","mid cap","small cap","index",
                  "dividend","msci","ftse","s&p","russell","nasdaq","dow jones","stoxx","world",
                  "emerging market","shares","aristocrat"]]
];
function classifyFromNameType(name, quoteType){
  const qt = (quoteType||"").toUpperCase();
  if(qt === "CRYPTOCURRENCY") return "Cripto";
  const haystack = (name||"").toLowerCase();
  for(const [label, keywords] of CLASSIFY_RULES){
    if(keywords.some(kw => haystack.includes(kw))) return label;
  }
  if(qt === "EQUITY") return "Azionario";
  return "";
}

const ALLOCATION_PALETTE = [
  "#1F6F5C", "#A13D2E", "#8A6D3B", "#3B5B8C", "#6E5A9C",
  "#3B8C87", "#B4884C", "#5B7A3A", "#9C5A7A", "#4C6E9C",
  "#7A8A3A", "#A15B3D", "#3D6E6E", "#8C5A3B", "#5A4C8C", "#3B8C5A"
];

// Canonical color per asset class, shared between the in-app composition chart
// and the exported client report so the same class always reads as the same color.
const CLASS_COLORS = {
  "Azionario": "#1F6F5C",
  "Obbligazionario": "#3B5B8C",
  "Immobiliare": "#8e6bbf",
  "Materie Prime": "#B4884C",
  "Oro": "#c9a53b",
  "Alternativi": "#A13D2E",
  "Liquidità": "#6b7a8a"
};
function hashStr(s){
  let h = 0;
  for(let i=0; i<s.length; i++){ h = (h*31 + s.charCodeAt(i)) | 0; }
  return Math.abs(h);
}
function colorForClass(name){
  const key = (name || "").trim();
  if(CLASS_COLORS[key]) return CLASS_COLORS[key];
  return ALLOCATION_PALETTE[hashStr(key) % ALLOCATION_PALETTE.length];
}

let allocationChartInstance = null;

function renderAllocationChart(p){
  const canvas = document.getElementById("allocationChart");
  const legend = document.getElementById("allocationLegend");
  if(!canvas) return;

  const rows = p.holdings.filter(h => (parseFloat(h.weight)||0) > 0);
  const total = rows.reduce((s,h) => s + (parseFloat(h.weight)||0), 0);

  if(!rows.length || total <= 0){
    if(allocationChartInstance){ allocationChartInstance.destroy(); allocationChartInstance = null; }
    canvas.getContext("2d").clearRect(0,0,canvas.width,canvas.height);
    legend.innerHTML = `<div class="pie-legend-item">${t("pieEmpty")}</div>`;
    return;
  }

  const byClass = {};
  rows.forEach(h => {
    const cls = (h.assetClass || "").trim() || t("unclassified");
    byClass[cls] = (byClass[cls] || 0) + (parseFloat(h.weight)||0);
  });
  const labels = Object.keys(byClass);
  const values = labels.map(l => byClass[l]);
  const colors = labels.map(l => colorForClass(l));

  legend.innerHTML = labels.map((l,i) => `
    <div class="pie-legend-item">
      <span class="pie-legend-swatch" style="background:${colors[i]}"></span>
      <span class="pie-legend-label" title="${escapeAttr(l)}">${escapeHtml(l)}</span>
      <span class="pie-legend-pct">${((values[i]/total)*100).toFixed(1)}%</span>
    </div>`).join("");

  if(typeof Chart === "undefined") return;

  const ctx = canvas.getContext("2d");
  if(allocationChartInstance) allocationChartInstance.destroy();
  allocationChartInstance = new Chart(ctx, {
    type: "doughnut",
    data: { labels, datasets: [{ data: values, backgroundColor: colors, borderColor: chartSurfaceColor(), borderWidth: 1.5 }] },
    options: {
      animation: false,
      responsive: true, maintainAspectRatio: false,
      cutout: "58%",
      plugins: {
        legend: { display:false },
        tooltip: { callbacks: { label: (ctx) => `${ctx.label}: ${((ctx.parsed/total)*100).toFixed(1)}%` } }
      }
    }
  });
}

function suggestRiskLabel(annVol){
  if(annVol===null||annVol===undefined||isNaN(annVol)) return "";
  const v = annVol*100;
  if(v<5) return "Basso";
  if(v<10) return "Medio-Basso";
  if(v<15) return "Medio";
  if(v<20) return "Medio-Alto";
  return "Alto";
}
function suggestReturnLabel(cagr){
  if(cagr===null||cagr===undefined||isNaN(cagr)) return "";
  const c = cagr*100;
  if(c<3) return "Basso";
  if(c<6) return "Medio-Basso";
  if(c<9) return "Medio";
  if(c<12) return "Medio-Alto";
  return "Alto";
}

function renderReportForm(p){
  const body = document.getElementById("reportFormBody");
  if(!body) return;
  const rc = p.reportContent || (p.reportContent = newReportContent());
  const r = p.lastResult;
  const riskSuggested = r ? (suggestRiskLabel(r.annVol) || "—") : t("rcNeedCalc");
  const returnSuggested = r ? (suggestReturnLabel(r.cagr) || "—") : t("rcNeedCalc");

  body.innerHTML = `
    <div class="control-group">

        <input type="text" id="rcRiskOverride" value="${escapeAttr(rc.riskLabelOverride)}" placeholder="${t('rcSuggestedPrefix')}${riskSuggested}" />
      </div>
      <div class="control-group" style="width:auto; min-width:200px;">
        <label>${t("rcReturnLabel")} <span class="hint">(${t("rcAutoHint")})</span></label>
        <input type="text" id="rcReturnOverride" value="${escapeAttr(rc.returnLabelOverride)}" placeholder="${t('rcSuggestedPrefix')}${returnSuggested}" />
      </div>
    </div>
    <div class="control-group">
      <label>${t("rcAllocLead")}</label>
      <textarea id="rcAllocLead" rows="2">${escapeHtml(rc.assetAllocationLead)}</textarea>
    </div>
    <div class="control-group">
      <label>${t("rcWhyLead")}</label>
      <textarea id="rcWhyLead" rows="2">${escapeHtml(rc.whyLead)}</textarea>
    </div>
    <div class="principles-grid">
      ${[0,1,2].map(i => `
        <div class="principle-card">
          <input type="text" class="icon-input" data-idx="${i}" data-field="icon" placeholder="${t('rcPrincipleIcon')}" value="${escapeAttr(rc.principles[i].icon)}" />
          <input type="text" data-idx="${i}" data-field="title" placeholder="${t('rcPrincipleTitle')}" value="${escapeAttr(rc.principles[i].title)}" />
          <textarea data-idx="${i}" data-field="text" rows="3" placeholder="${t('rcPrincipleText')}">${escapeHtml(rc.principles[i].text)}</textarea>
        </div>
      `).join("")}
    </div>
    <div class="control-group">
      <label>${t("rcProfileP1")}</label>
      <textarea id="rcProfileP1" rows="2">${escapeHtml(rc.profileParagraph1)}</textarea>
    </div>
    <div class="control-group">
      <label>${t("rcProfileP2")}</label>
      <textarea id="rcProfileP2" rows="2">${escapeHtml(rc.profileParagraph2)}</textarea>
    </div>
    <div class="control-group">
      <label>${t("rcKeyQuote")}</label>
      <input type="text" id="rcKeyQuote" value="${escapeAttr(rc.keyMessageQuote)}" />
    </div>
    <div class="control-group">
      <label>${t("rcKeyCaption")}</label>
      <input type="text" id="rcKeyCaption" value="${escapeAttr(rc.keyMessageCaption)}" />
    </div>
  `;

  const bind = (id, field) => {
    const el = document.getElementById(id);
    el.addEventListener("change", () => { rc[field] = el.value; saveState(); });
  };
  bind("rcProfileLabel", "profileLabel");
  bind("rcHeroSubtitle", "heroSubtitle");
  bind("rcSintesiLead", "inSintesiLead");
  bind("rcAllocLead", "assetAllocationLead");
  bind("rcWhyLead", "whyLead");
  bind("rcProfileP1", "profileParagraph1");
  bind("rcProfileP2", "profileParagraph2");
  bind("rcKeyQuote", "keyMessageQuote");
  bind("rcKeyCaption", "keyMessageCaption");
  document.getElementById("rcAvgCost").addEventListener("change", (e) => { rc.avgCost = parseFloat(e.target.value)||0; saveState(); });
  document.getElementById("rcRiskOverride").addEventListener("change", (e) => { rc.riskLabelOverride = e.target.value; saveState(); });
  document.getElementById("rcReturnOverride").addEventListener("change", (e) => { rc.returnLabelOverride = e.target.value; saveState(); });

  body.querySelectorAll(".principle-card input, .principle-card textarea").forEach(el => {
    el.addEventListener("change", () => {
      const idx = parseInt(el.dataset.idx, 10);
      const field = el.dataset.field;
      rc.principles[idx][field] = el.value;
      saveState();
    });
  });
}


async function resolveHolding(p, h, query, statusDiv, tr){
  try{
    const res = await fetch(`/api/resolve?q=${encodeURIComponent(query)}`);
    const data = await res.json();
    if(data.error || !data.candidates || !data.candidates.length){
      statusDiv.textContent = t("noResults");
      h.resolveState = "missing";
      return;
    }
    statusDiv.innerHTML = "";
    const ul = document.createElement("ul");
    ul.className = "candidate-list";
    data.candidates.slice(0,8).forEach(c => {
      const li = document.createElement("li");
      li.innerHTML = `<span class="sym">${c.symbol}</span>${escapeHtml(c.name)}<span class="exch">${escapeHtml(c.exchange)}</span>`;
      li.onclick = async () => {
        h.ticker = c.symbol;
        h.name = c.name;
        h.resolveState = "found";
        saveState();
        setCachedInstrument(query, { ticker: c.symbol, name: c.name });
        if(h.isin && h.isin.trim() && cacheKey(h.isin) !== cacheKey(query)){
          setCachedInstrument(h.isin, { ticker: c.symbol, name: c.name });
        }
        renderMain();
        await autoClassify(p, h, c.name, c.type);
      };
      ul.appendChild(li);
    });
    statusDiv.appendChild(ul);
  }catch(e){
    statusDiv.textContent = t("networkError");
  }
}

const REPORT_CLASS_COLORS = CLASS_COLORS;

function reportFmtPct(v, d=2){ return (v===null||v===undefined||isNaN(v)) ? "—" : (v*100).toFixed(d).replace(".",",") + "%"; }
function reportFmtNum(v, d=2){ return (v===null||v===undefined||isNaN(v)) ? "—" : v.toFixed(d).replace(".",","); }
function reportCap(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
function reportMonthYear(dateStr, long){
  return reportCap(new Intl.DateTimeFormat("it-IT", {month: long ? "long" : "short", year:"numeric"})
    .format(new Date(dateStr + "T00:00:00")));
}

function buildEquitySvg(dates, values, benchmarkValues, benchmarkName){
  const W = 1000, H = 260, padL = 44, padR = 20, padT = 16, padB = 28;
  const plotW = W-padL-padR, plotH = H-padT-padB;
  const allVals = benchmarkValues ? values.concat(benchmarkValues) : values;
  const minV = Math.min(...allVals), maxV = Math.max(...allVals);
  const range = (maxV-minV) || 1;
  const N = values.length;
  const x = i => padL + (i/(N-1))*plotW;
  const y = v => padT + (1 - (v-minV)/range)*plotH;

  const pathFor = arr => arr.map((v,i) => `${i===0?'M':'L'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const linePath = pathFor(values);
  const areaPath = linePath + ` L${x(N-1).toFixed(1)},${(padT+plotH).toFixed(1)} L${x(0).toFixed(1)},${(padT+plotH).toFixed(1)} Z`;
  const benchPath = benchmarkValues
    ? `<path d="${pathFor(benchmarkValues)}" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5,4"/>` : "";

  const gridLines = [0,0.5,1].map(f => {
    const yy = padT + f*plotH;
    const val = maxV - f*range;
    return `<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" stroke="#dbe4ea" stroke-width="1"/>
    <text x="${padL-6}" y="${(yy+3).toFixed(1)}" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="10" fill="#64748b">${Math.round(val)}</text>`;
  }).join("");

  const legend = benchmarkValues ? `
    <g font-family="Inter,Arial,sans-serif" font-size="11" fill="#64748b">
      <rect x="${padL}" y="4" width="10" height="3" fill="#1F6F5C"></rect><text x="${padL+14}" y="9">Portafoglio</text>
      <line x1="${padL+110}" y1="5.5" x2="${padL+122}" y2="5.5" stroke="#64748b" stroke-width="1.6" stroke-dasharray="4,3"></line><text x="${padL+126}" y="9">${escapeHtml(benchmarkName)}</text>
    </g>` : "";

  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%; height:auto; display:block;">
    ${gridLines}
    <path d="${areaPath}" fill="#1F6F5C" fill-opacity="0.10" stroke="none"></path>
    <path d="${linePath}" fill="none" stroke="#1F6F5C" stroke-width="2"></path>
    ${benchPath}
    ${legend}
    <text x="${padL}" y="${H-6}" font-family="Inter,Arial,sans-serif" font-size="10" fill="#64748b">${reportMonthYear(dates[0], true)}</text>
    <text x="${W-padR}" y="${H-6}" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="10" fill="#64748b">${reportMonthYear(dates[dates.length-1], true)}</text>
  </svg>`;
}

const COMPARE_PALETTE = ["#1F6F5C","#36b37e","#d64545","#8e6bbf","#f59e0b","#0F2E25"];

function buildMultiEquitySvg(seriesList){
  const W = 1100, H = 320, padL = 44, padR = 20, padT = 16, padB = 40;
  const plotW = W-padL-padR, plotH = H-padT-padB;
  const allVals = seriesList.flatMap(s => s.values);
  const minV = Math.min(...allVals), maxV = Math.max(...allVals);
  const range = (maxV-minV) || 1;
  const y = v => padT + (1 - (v-minV)/range)*plotH;

  const gridLines = [0,0.5,1].map(f => {
    const yy = padT + f*plotH;
    const val = maxV - f*range;
    return `<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" stroke="#dbe4ea" stroke-width="1"/>
    <text x="${padL-6}" y="${(yy+3).toFixed(1)}" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="10" fill="#64748b">${Math.round(val)}</text>`;
  }).join("");

  const paths = seriesList.map(s => {
    const N = s.values.length;
    const x = i => padL + (i/(N-1))*plotW;
    const d = s.values.map((v,i) => `${i===0?'M':'L'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2"></path>`;
  }).join("");

  const legend = seriesList.map((s,i) => `
    <g font-family="Inter,Arial,sans-serif" font-size="11" fill="#64748b" transform="translate(${padL + i*170},${H-16})">
      <rect width="10" height="3" fill="${s.color}"></rect><text x="14" y="5">${escapeHtml(s.name)}</text>
    </g>`).join("");

  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%; height:auto; display:block;">
    ${gridLines}
    ${paths}
    ${legend}
  </svg>`;
}
